
[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroai-workbench"
dynamic = ["version"]
description = "Offline-first assessment and observatory workbench for controlled NeuroAI evidence and decision records"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "NeuroAI Workbench Contributors"}]
keywords = ["neurotechnology", "neuroai", "assessment", "evidence", "governance", "json-schema"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "jsonschema>=4.26,<5",
]

[project.optional-dependencies]
dev = [
  "build>=1.3,<2",
  "coverage[toml]>=7.10,<8",
  "mypy>=1.17,<2",
  "types-jsonschema>=4.26,<5",
  "pip-audit>=2.9,<3",
  "pytest>=9.0,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.12,<1",
  "twine>=6.1,<7",
]

[project.scripts]
neuroai-workbench = "neuroai_workbench.cli:main"
neuroai-monitor = "neuroai_workbench.monitoring_cli:main"

[project.urls]
Documentation = "https://github.com/fraware/neuroai-workbench/tree/main/docs"
Issues = "https://github.com/fraware/neuroai-workbench/issues"
Source = "https://github.com/fraware/neuroai-workbench"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "neuroai_workbench.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
neuroai_workbench = [
  "static/*",
  "resources/v4_2/*",
  "resources/operations/*",
  "resources/collector/*",
  "resources/delta/*",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["neuroai_workbench"]
omit = ["src/neuroai_workbench/__main__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["artifacts", "workspaces"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
exclude = "^(tests|artifacts)/"
