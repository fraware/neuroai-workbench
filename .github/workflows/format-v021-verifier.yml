name: Format v0.2.1 verifier

on:
  push:
    branches:
      - agent/verify-v0.2.1-release

permissions:
  contents: write

jobs:
  format:
    name: format-v0.2.1-verifier
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --require-hashes -r requirements/constraints.txt
      - run: python -m ruff format scripts/verify_github_release_assets.py
      - run: python -m ruff check scripts/verify_github_release_assets.py
      - name: Commit exact formatter output
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/verify_github_release_assets.py
          git commit -m 'Format v0.2.1 release verifier' || exit 0
          git push
