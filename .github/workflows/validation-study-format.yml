name: Validation study formatting

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --require-hashes -r requirements/constraints.txt
      - run: python -m ruff format src/neuroai_workbench/validation_study.py tests/unit/test_validation_study.py
      - run: python -m ruff format --check src/neuroai_workbench/validation_study.py tests/unit/test_validation_study.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: validation-study-formatted
          path: |
            src/neuroai_workbench/validation_study.py
            tests/unit/test_validation_study.py
          if-no-files-found: error
