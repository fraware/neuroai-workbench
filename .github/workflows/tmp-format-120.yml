name: Temporary issue 120 formatter

on:
  push:
    branches:
      - agent/120-comparative-live-refresh
    paths:
      - .github/workflows/tmp-format-120.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/120-comparative-live-refresh
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install --require-hashes -r requirements/constraints.txt
      - run: >-
          python -m ruff format
          src/neuroai_workbench/shadow_refresh/comparative.py
          tests/unit/test_shadow_comparative_refresh.py
          scripts/run_issue120_comparative_refresh.py
      - name: Commit exact formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/neuroai_workbench/shadow_refresh/comparative.py tests/unit/test_shadow_comparative_refresh.py scripts/run_issue120_comparative_refresh.py
          git commit -m "style: apply Ruff formatting to issue 120 runner"
          git push origin HEAD:agent/120-comparative-live-refresh
