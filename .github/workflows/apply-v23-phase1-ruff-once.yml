name: Apply exact Phase 1 Ruff fixes once

on:
  push:
    branches:
      - agent/v23-canonical-migration-phase1

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/v23-canonical-migration-phase1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --require-hashes -r requirements/constraints.txt
      - name: Apply exact Ruff corrections
        run: |
          python -m ruff check --fix scripts/migrate_v22_consolidated.py tests/unit/test_v22_migration_contract.py
          python -m ruff format scripts/migrate_v22_consolidated.py tests/unit/test_v22_migration_contract.py
      - name: Constrain changed files
        run: |
          python - <<'PY'
          import subprocess

          expected = {
              "scripts/migrate_v22_consolidated.py",
              "tests/unit/test_v22_migration_contract.py",
          }
          changed = set(
              subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          )
          if changed != expected:
              raise SystemExit(f"Unexpected Ruff change set: {sorted(changed)}")
          PY
      - name: Commit exact corrections
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/migrate_v22_consolidated.py tests/unit/test_v22_migration_contract.py
          git commit -m "style: apply exact Phase 1 Ruff fixes"
          git push origin HEAD:agent/v23-canonical-migration-phase1
