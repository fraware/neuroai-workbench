name: Format source-route resilience once

on:
  push:
    branches:
      - agent/source-route-resilience

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/source-route-resilience
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install pinned Ruff
        run: python -m pip install ruff==0.16.1
      - name: Format exact changed Python files
        run: |
          python -m ruff format \
            src/neuroai_workbench/collector/source_routes.py \
            tests/unit/test_source_routes.py \
            tests/unit/test_source_routes_orchestration.py \
            tests/unit/test_source_routes_primary_identity.py \
            tests/unit/test_source_routes_defensive.py
      - name: Commit formatter output only when changed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/neuroai_workbench/collector/source_routes.py \
            tests/unit/test_source_routes.py \
            tests/unit/test_source_routes_orchestration.py \
            tests/unit/test_source_routes_primary_identity.py \
            tests/unit/test_source_routes_defensive.py
          git commit -m "Format source-route resilience"
          git push origin HEAD:agent/source-route-resilience
