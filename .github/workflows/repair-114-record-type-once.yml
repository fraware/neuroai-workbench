name: Repair #114 record type once

on:
  push:
    branches:
      - agent/114-explicit-nonauthoritative-record-type
    paths:
      - ".github/workflows/repair-114-record-type-once.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/114-explicit-nonauthoritative-record-type
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Add explicit non-authoritative record type
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("src/neuroai_workbench/governance_rehearsal.py")
          source = source_path.read_text(encoding="utf-8")
          execution = 'REHEARSAL_EXECUTION_MODE = "SYNTHETIC_REHEARSAL"\n'
          record_type = 'REHEARSAL_RECORD_TYPE = "NON_AUTHORITATIVE_GOVERNANCE_REHEARSAL"\n'
          if source.count(execution) != 1:
              raise SystemExit("execution-mode anchor drifted")
          if record_type not in source:
              source = source.replace(execution, execution + record_type, 1)
          handoff_anchor = '        "schema_version": "1",\n        "handoff_state": "TEMPLATE_ONLY_REAL_HUMAN_EXECUTION_DEFERRED",\n'
          handoff_replacement = '        "schema_version": "1",\n        "record_type": REHEARSAL_RECORD_TYPE,\n        "handoff_state": "TEMPLATE_ONLY_REAL_HUMAN_EXECUTION_DEFERRED",\n'
          if source.count(handoff_anchor) != 1:
              raise SystemExit("handoff anchor drifted")
          source = source.replace(handoff_anchor, handoff_replacement, 1)
          certificate_anchor = '        "schema_version": "1",\n        "certificate_id": f"GOVREHEARSAL-{uuid4().hex[:16].upper()}",\n'
          certificate_replacement = '        "schema_version": "1",\n        "record_type": REHEARSAL_RECORD_TYPE,\n        "certificate_id": f"GOVREHEARSAL-{uuid4().hex[:16].upper()}",\n'
          if source.count(certificate_anchor) != 1:
              raise SystemExit("certificate anchor drifted")
          source = source.replace(certificate_anchor, certificate_replacement, 1)
          source_path.write_text(source, encoding="utf-8")

          test_path = Path("tests/unit/test_governance_rehearsal.py")
          test = test_path.read_text(encoding="utf-8")
          import_anchor = '    REHEARSAL_EXECUTION_MODE,\n'
          if test.count(import_anchor) != 1:
              raise SystemExit("test import anchor drifted")
          test = test.replace(import_anchor, import_anchor + '    REHEARSAL_RECORD_TYPE,\n', 1)
          certificate_assert = '    assert certificate["execution_mode"] == REHEARSAL_EXECUTION_MODE\n'
          if test.count(certificate_assert) != 1:
              raise SystemExit("certificate assertion anchor drifted")
          test = test.replace(
              certificate_assert,
              certificate_assert + '    assert certificate["record_type"] == REHEARSAL_RECORD_TYPE\n',
              1,
          )
          handoff_assert = '    assert handoff["handoff_state"] == "TEMPLATE_ONLY_REAL_HUMAN_EXECUTION_DEFERRED"\n'
          if test.count(handoff_assert) != 1:
              raise SystemExit("handoff assertion anchor drifted")
          test = test.replace(
              handoff_assert,
              '    assert handoff["record_type"] == REHEARSAL_RECORD_TYPE\n' + handoff_assert,
              1,
          )
          deterministic_anchor = '    assert first == second\n'
          if test.count(deterministic_anchor) != 1:
              raise SystemExit("deterministic assertion anchor drifted")
          test = test.replace(
              deterministic_anchor,
              deterministic_anchor + '    assert first["record_type"] == REHEARSAL_RECORD_TYPE\n',
              1,
          )
          test_path.write_text(test, encoding="utf-8")

          doc_path = Path("docs/reference/governance-rehearsal-handoff.md")
          doc = doc_path.read_text(encoding="utf-8")
          doc_anchor = '`SYNTHETIC_REHEARSAL`\n'
          if doc.count(doc_anchor) != 1:
              raise SystemExit("documentation execution-mode anchor drifted")
          doc = doc.replace(
              doc_anchor,
              doc_anchor + '\nEvery repository-controlled rehearsal certificate and handoff template is explicitly typed as:\n\n`NON_AUTHORITATIVE_GOVERNANCE_REHEARSAL`\n',
              1,
          )
          doc_path.write_text(doc, encoding="utf-8")
          PY
      - name: Install exact dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements/constraints.txt
          python -m pip install --no-deps -e .
      - name: Verify record type contract
        run: |
          python -m ruff format src/neuroai_workbench/governance_rehearsal.py tests/unit/test_governance_rehearsal.py
          python -m ruff check src/neuroai_workbench/governance_rehearsal.py tests/unit/test_governance_rehearsal.py
          python -m mypy src/neuroai_workbench
          python -m pytest tests/unit/test_governance_rehearsal.py tests/unit/test_governance_rehearsal_adversarial.py -q
      - name: Commit record type contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/neuroai_workbench/governance_rehearsal.py tests/unit/test_governance_rehearsal.py docs/reference/governance-rehearsal-handoff.md
          git diff --cached --check
          git commit -m "Make governance rehearsal record type explicit"
          git push origin HEAD:agent/114-explicit-nonauthoritative-record-type
