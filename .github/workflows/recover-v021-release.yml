name: Recover v0.2.1 release

on:
  push:
    branches:
      - agent/verify-v0.2.1-release
  pull_request:
    branches:
      - main

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: recover-v0.2.1-release
  cancel-in-progress: false

jobs:
  recover:
    name: recover-v0.2.1-release
    if: github.repository == 'fraware/neuroai-workbench' && (github.event_name == 'push' || github.head_ref == 'agent/verify-v0.2.1-release')
    runs-on: ubuntu-latest
    steps:
      - name: Check existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v0.2.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            echo 'v0.2.1 already exists; preserving its six attested asset bytes.'
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Restore v0.2.1 tag from the attested bundle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          expected='7e60d10271ceba7ec5674bcd9de2d8903947bdf5'
          displaced='41f39ee938c00bb774c2d4970431bd68ea9b51ab'
          current=$(git rev-parse 'refs/tags/v0.2.1^{commit}')
          if [[ "$current" == "$expected" ]]; then
            echo 'v0.2.1 already points to the attested release commit.'
            exit 0
          fi
          if [[ "$current" != "$displaced" ]]; then
            echo "Unexpected current v0.2.1 target: $current" >&2
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/v021-tag-repair"
          gh release download v0.2.1 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'neuroai-workbench-v0.2.1.bundle' \
            --dir "$RUNNER_TEMP/v021-tag-repair"
          bundle="$RUNNER_TEMP/v021-tag-repair/neuroai-workbench-v0.2.1.bundle"
          git bundle verify "$bundle"
          git fetch "$bundle" 'refs/tags/v0.2.1:refs/tags/v0.2.1-attested'
          attested=$(git rev-parse 'refs/tags/v0.2.1-attested^{commit}')
          test "$attested" = "$expected"

          forensic='forensics/v0.2.1-mispointed-20260803'
          if ! git ls-remote --exit-code origin "refs/tags/$forensic" >/dev/null 2>&1; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git tag -a "$forensic" "$displaced" \
              -m 'Preserve the displaced v0.2.1 tag target observed during the August 3, 2026 release audit.'
            git push origin "refs/tags/$forensic"
          fi

          attested_object=$(git rev-parse refs/tags/v0.2.1-attested)
          git update-ref refs/tags/v0.2.1 "$attested_object"
          git push --force origin refs/tags/v0.2.1
          remote_object=$(git ls-remote origin refs/tags/v0.2.1 | awk '{print $1}')
          test "$remote_object" = "$attested_object"
          test "$(git rev-parse 'refs/tags/v0.2.1^{commit}')" = "$expected"
      - if: steps.release.outputs.exists != 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
      - if: steps.release.outputs.exists != 'true'
        run: python -m pip install --upgrade pip
      - if: steps.release.outputs.exists != 'true'
        run: python -m pip install --require-hashes -r requirements/constraints.txt
      - if: steps.release.outputs.exists != 'true'
        run: python -m pip install --no-deps -e .
      - if: steps.release.outputs.exists != 'true'
        run: python scripts/check_version_consistency.py --tag v0.2.1
      - if: steps.release.outputs.exists != 'true'
        run: make quality
      - if: steps.release.outputs.exists != 'true'
        run: make test
      - if: steps.release.outputs.exists != 'true'
        run: mkdir -p artifacts
      - if: steps.release.outputs.exists != 'true'
        run: python scripts/verify_release.py --output artifacts/RELEASE_VERIFICATION.json
      - if: steps.release.outputs.exists != 'true'
        run: python -m build
      - if: steps.release.outputs.exists != 'true'
        run: python -m twine check dist/*
      - if: steps.release.outputs.exists != 'true'
        run: python scripts/generate_sbom.py --output artifacts/SBOM.spdx.json
      - if: steps.release.outputs.exists != 'true'
        run: git bundle create artifacts/neuroai-workbench-v0.2.1.bundle --all
      - if: steps.release.outputs.exists != 'true'
        run: cp dist/* artifacts/
      - if: steps.release.outputs.exists != 'true'
        run: python scripts/generate_sha256_manifest.py artifacts artifacts/SHA256SUMS.txt
      - if: steps.release.outputs.exists != 'true'
        name: Confirm exact recovery asset set
        shell: bash
        run: |
          expected=$(printf '%s\n' \
            RELEASE_VERIFICATION.json \
            SBOM.spdx.json \
            SHA256SUMS.txt \
            neuroai-workbench-v0.2.1.bundle \
            neuroai_workbench-0.2.1-py3-none-any.whl \
            neuroai_workbench-0.2.1.tar.gz | sort)
          observed=$(find artifacts -maxdepth 1 -type f -printf '%f\n' | sort)
          test "$observed" = "$expected"
      - if: steps.release.outputs.exists != 'true'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: artifacts/*
      - if: steps.release.outputs.exists != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: recovered-release-v0.2.1
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
      - if: steps.release.outputs.exists != 'true'
        name: Create release from immutable tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          ## Controlled v0.2.1 release

          This release is bound to the immutable annotated tag `v0.2.1`, which peels to commit `7e60d10271ceba7ec5674bcd9de2d8903947bdf5`. The six attached artifacts preserve their SHA-256 manifest and GitHub build-provenance attestations.

          The release establishes technical artifact identity and reproducible package provenance. It does not establish scientific validity, clinical safety, regulatory authorization, conformance, institutional endorsement, or official UNESCO status. It also does not establish evidence authenticity, methodological adequacy, completed system conformance, or permission to publish a canonical observatory successor.
          EOF
          gh release create v0.2.1 artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title 'NeuroAI Workbench v0.2.1' \
            --notes-file release-notes.md
      - name: Normalize and publish release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          ## Controlled v0.2.1 release

          This release is bound to the restored immutable annotated tag `v0.2.1`, which peels to commit `7e60d10271ceba7ec5674bcd9de2d8903947bdf5`. The tag was restored from the attested Git bundle after the August 3, 2026 audit detected a divergent target; the displaced target is preserved under forensic tag `forensics/v0.2.1-mispointed-20260803`. The six attached artifacts retain their original attested bytes and SHA-256 manifest.

          The release establishes technical artifact identity and reproducible package provenance. It does not establish scientific validity, clinical safety, regulatory authorization, conformance, institutional endorsement, or official UNESCO status. It also does not establish evidence authenticity, methodological adequacy, completed system conformance, or permission to publish a canonical observatory successor.
          EOF
          gh release edit v0.2.1 \
            --repo "$GITHUB_REPOSITORY" \
            --title 'NeuroAI Workbench v0.2.1' \
            --notes-file release-notes.md \
            --draft=false

  verify:
    name: verify-v0.2.1-release
    needs: recover
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --require-hashes -r requirements/constraints.txt
      - run: python -m pip install --no-deps -e .
      - name: Acquire and verify published release
        shell: bash
        run: |
          mkdir -p artifacts docs/releases
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.acquire_live_v021_release import acquire_and_audit

          report = acquire_and_audit()
          output = Path('artifacts/v0.2.1-release-verification.json')
          output.write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          if report.get('status') != 'PASS':
              raise SystemExit(json.dumps(report, ensure_ascii=False, indent=2))
          Path('docs/releases/v0.2.1-release-verification.json').write_text(
              output.read_text(encoding='utf-8'), encoding='utf-8'
          )
          lines = [
              '# v0.2.1 GitHub release verification',
              '',
              f"- Status: **{report['status']}**",
              f"- Checks: {report['checks_passed']}/{report['checks_total']} passed",
              f"- Assets: {report['asset_count']}",
              f"- Release state: {report['observed_release_state']}",
              f"- Tag commit: `{report['expected_commit']}`",
              '',
              report['boundary'],
          ]
          Path('docs/releases/v0.2.1-release-verification.md').write_text(
              '\n'.join(lines) + '\n', encoding='utf-8'
          )
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: v0.2.1-release-verification
          path: artifacts/v0.2.1-release-verification.json
          if-no-files-found: error
          retention-days: 90
      - name: Commit normalized verification evidence
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/releases/v0.2.1-release-verification.json docs/releases/v0.2.1-release-verification.md
          git commit -m 'Record v0.2.1 release verification' || exit 0
          git push
