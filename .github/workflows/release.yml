name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-release:
    name: build-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --require-hashes -r requirements/constraints.txt
      - run: python -m pip install --no-deps -e .
      - run: python scripts/check_version_consistency.py --tag "${GITHUB_REF_NAME}"
      - run: make quality
      - run: make test
      - run: mkdir -p artifacts
      - run: python scripts/verify_release.py --output artifacts/RELEASE_VERIFICATION.json
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/generate_sbom.py --output artifacts/SBOM.spdx.json
      - run: git bundle create "artifacts/neuroai-workbench-${GITHUB_REF_NAME}.bundle" --all
      - run: cp dist/* artifacts/
      - run: python scripts/generate_sha256_manifest.py artifacts artifacts/SHA256SUMS.txt
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: "artifacts/*"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ github.ref_name }}
          path: artifacts/
          if-no-files-found: error
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" artifacts/*
          --draft
          --generate-notes
          --title "NeuroAI Workbench ${GITHUB_REF_NAME}"
