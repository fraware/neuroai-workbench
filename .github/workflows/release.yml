
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-release:
    name: build-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .[dev]
      - run: python scripts/check_version_consistency.py --tag "${GITHUB_REF_NAME}"
      - run: make quality
      - run: make test
      - run: mkdir -p artifacts
      - run: python scripts/verify_release.py --output artifacts/RELEASE_VERIFICATION.json
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/generate_sbom.py --output artifacts/SBOM.spdx.json
      - run: git bundle create "artifacts/neuroai-workbench-${GITHUB_REF_NAME}.bundle" --all
      - run: cp dist/* artifacts/
      - run: python scripts/generate_sha256_manifest.py artifacts artifacts/SHA256SUMS.txt
      - uses: actions/attest@v4
        with:
          subject-path: "artifacts/*"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.ref_name }}
          path: artifacts/
          if-no-files-found: error
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" artifacts/*
          --draft
          --generate-notes
          --title "NeuroAI Workbench ${GITHUB_REF_NAME}"
