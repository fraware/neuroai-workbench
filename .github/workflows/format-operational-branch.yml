name: Format operational branch once

on:
  push:
    branches:
      - agent/153-operational-99-due-cycle
    paths:
      - .github/workflows/format-operational-branch.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/153-operational-99-due-cycle
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --require-hashes -r requirements/constraints.txt
      - name: Apply repository-pinned Ruff formatter
        run: |
          python -m ruff format src/neuroai_workbench/collector/scheduler.py tests/unit/test_collector_operational_runtime.py tests/unit/test_collector_scheduler_defensive.py tests/unit/test_collector_operational_coverage.py tests/unit/test_collector_run_ledger_adversarial.py
      - name: Commit formatter output only
        run: |
          if git diff --quiet --exit-code; then
            echo "No formatter changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/neuroai_workbench/collector/scheduler.py tests/unit/test_collector_operational_runtime.py tests/unit/test_collector_scheduler_defensive.py tests/unit/test_collector_operational_coverage.py tests/unit/test_collector_run_ledger_adversarial.py
          git diff --cached --check
          git commit -m "Apply pinned Ruff formatting to operational runtime"
          git push origin HEAD:agent/153-operational-99-due-cycle
