name: Temporary monitoring hardening

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: temporary-monitoring-hardening
  cancel-in-progress: false

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/observatory-operations-foundation
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --require-hashes -r requirements/constraints.txt
      - name: Apply capture identity and ingestion hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_region(text: str, start_marker: str, end_marker: str, replacement: str) -> str:
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              return text[:start] + replacement + text[end:]

          def replace_function(text: str, name: str, replacement: str) -> str:
              start = text.find(f"def {name}(")
              if start < 0:
                  raise SystemExit(f"expected function not found: {name}")
              next_function = text.find("\ndef ", start + 1)
              end = len(text) if next_function < 0 else next_function + 1
              return text[:start] + replacement.rstrip() + "\n\n" + text[end:]

          module = Path("src/neuroai_workbench/monitoring.py")
          text = module.read_text(encoding="utf-8")
          text = text.replace("import json\nfrom datetime", "import ipaddress\nimport json\nfrom datetime", 1)
          text = text.replace(
              "MONITORING_BOUNDARY = (",
              "MAX_SNAPSHOT_BYTES = 10 * 1024 * 1024\n\nMONITORING_BOUNDARY = (",
              1,
          )
          helpers = '''def _public_url_error(value: str) -> str | None:
              parsed = urlparse(value)
              if parsed.scheme not in {"http", "https"} or not parsed.hostname:
                  return "URL must use http or https and include a hostname"
              if parsed.username or parsed.password:
                  return "URL must not contain embedded credentials"
              hostname = parsed.hostname.lower().rstrip(".")
              if hostname == "localhost" or hostname.endswith((".localhost", ".local", ".internal")):
                  return "URL must not target a local or internal hostname"
              try:
                  address = ipaddress.ip_address(hostname)
              except ValueError:
                  return None
              if not address.is_global:
                  return "URL must not target a private, loopback, link-local, reserved, multicast, or unspecified address"
              return None


          def _normalize_retrieved_at(value: str | None) -> tuple[str, str]:
              raw = value or utc_now()
              try:
                  parsed = datetime.fromisoformat(raw.replace("Z", "+00:00"))
              except ValueError as exc:
                  raise ValueError("retrieved_at must be an ISO-8601 timestamp") from exc
              if parsed.tzinfo is None or parsed.utcoffset() is None:
                  raise ValueError("retrieved_at must include an explicit timezone")
              normalized = parsed.astimezone(timezone.utc)
              timestamp_id = normalized.strftime("%Y%m%dT%H%M%S%fZ")
              return normalized.isoformat().replace("+00:00", "Z"), timestamp_id


          '''
          text = text.replace("def _schema(name: str)", helpers + "def _schema(name: str)", 1)

          url_block = '''        url = record.get("url")
              if isinstance(url, str):
                  parsed = urlparse(url)
                  if record.get("source_class") == "CONTROLLED_LOCAL_INPUT" and not parsed.scheme:
                      warnings.append(
                          {
                              "code": "NON_PORTABLE_LOCAL_REFERENCE",
                              "path": f"{path}.url",
                              "value": url,
                              "message": "Legacy local path retained as provenance; migrate it to a content-addressed workspace object.",
                          }
                      )
                  else:
                      url_error = _public_url_error(url)
                      if url_error:
                          errors.append(
                              {
                                  "code": "INVALID_PUBLIC_URL",
                                  "path": f"{path}.url",
                                  "value": url,
                                  "message": url_error,
                              }
                          )

          '''
          text = replace_region(
              text,
              '        url = record.get("url")\n',
              '        last_retrieval = record.get("last_successful_retrieval")\n',
              url_block,
          )

          snapshot_block = '''    if not data:
              raise ValueError("A successful snapshot cannot contain zero bytes")
              if len(data) > MAX_SNAPSHOT_BYTES:
                  raise ValueError(f"Snapshot exceeds the {MAX_SNAPSHOT_BYTES}-byte local ingestion limit")
              registry, state = _load_registry_and_state(workspace)
              source = _registry_record(registry, source_id)
              retrieved, timestamp_id = _normalize_retrieved_at(retrieved_at)
              retrieval_reference = retrieval_url or str(source["url"])
              if source.get("source_class") != "CONTROLLED_LOCAL_INPUT":
                  url_error = _public_url_error(retrieval_reference)
                  if url_error:
                      raise ValueError(f"retrieval_url is invalid: {url_error}")
              if original_filename is not None and Path(original_filename).name != original_filename:
                  raise ValueError("original_filename must be a basename without directory components")

              digest = sha256_bytes(data)
              snapshot_id = f"SNAP-{source_id}-{timestamp_id}-{digest[:12]}"
          '''
          text = replace_region(
              text,
              '    if not data:\n        raise ValueError("A successful snapshot cannot contain zero bytes")\n',
              '    snapshot_root = safe_join(_monitoring_root(workspace) / "snapshots", source_id)\n',
              snapshot_block,
          )
          text = text.replace('"retrieval_url": retrieval_url or source["url"],', '"retrieval_url": retrieval_reference,', 1)
          module.write_text(text, encoding="utf-8")

          regular_tests = Path("tests/unit/test_monitoring.py")
          tests = regular_tests.read_text(encoding="utf-8")
          tests += '''

          def test_repeated_unchanged_capture_is_distinct_and_content_deduplicated(tmp_path: Path) -> None:
              workspace = initialize(tmp_path)
              first = record_snapshot(
                  workspace,
                  "SRC-0001",
                  b"same-bytes",
                  media_type="text/plain",
                  retrieved_at="2026-08-02T01:00:00Z",
              )
              later = record_snapshot(
                  workspace,
                  "SRC-0001",
                  b"same-bytes",
                  media_type="text/plain",
                  retrieved_at="2026-08-02T02:00:00Z",
              )
              assert first["snapshot_id"] != later["snapshot_id"]
              assert first["sha256"] == later["sha256"]
              assert compare_snapshots(
                  workspace,
                  "SRC-0001",
                  first["snapshot_id"],
                  later["snapshot_id"],
              )["classification"] == "NO_CHANGE"
              with pytest.raises(ValueError, match="different metadata"):
                  record_snapshot(
                      workspace,
                      "SRC-0001",
                      b"same-bytes",
                      media_type="application/octet-stream",
                      retrieved_at="2026-08-02T01:00:00Z",
                  )


          def test_snapshot_size_url_timezone_and_filename_controls(tmp_path: Path) -> None:
              from neuroai_workbench import monitoring

              workspace = initialize(tmp_path)
              with pytest.raises(ValueError, match="ingestion limit"):
                  record_snapshot(workspace, "SRC-0001", b"x" * (monitoring.MAX_SNAPSHOT_BYTES + 1))
              with pytest.raises(ValueError, match="explicit timezone"):
                  record_snapshot(workspace, "SRC-0001", b"content", retrieved_at="2026-08-02T01:00:00")
              with pytest.raises(ValueError, match="retrieval_url is invalid"):
                  record_snapshot(
                      workspace,
                      "SRC-0001",
                      b"content",
                      retrieval_url="http://127.0.0.1/private",
                  )
              with pytest.raises(ValueError, match="basename"):
                  record_snapshot(
                      workspace,
                      "SRC-0001",
                      b"content",
                      original_filename="/tmp/private.txt",
                  )

              records = small_registry()
              records[0]["url"] = "http://127.0.0.1/private"
              result = validate_source_registry(records)
              assert any(item["code"] == "INVALID_PUBLIC_URL" for item in result["errors"])
          '''
          regular_tests.write_text(tests, encoding="utf-8")

          adversarial_tests = Path("tests/unit/test_monitoring_adversarial.py")
          tests = adversarial_tests.read_text(encoding="utf-8")
          replacement = '''def test_repeated_capture_identity_and_manifest_immutability(tmp_path: Path) -> None:
              workspace = initialized_workspace(tmp_path)
              first = record_snapshot(
                  workspace,
                  "SRC-0001",
                  b"same-bytes",
                  media_type="text/plain",
                  retrieved_at="2026-08-02T01:00:00Z",
              )
              later = record_snapshot(
                  workspace,
                  "SRC-0001",
                  b"same-bytes",
                  media_type="text/plain",
                  retrieved_at="2026-08-02T02:00:00Z",
              )
              assert first["snapshot_id"] != later["snapshot_id"]
              assert first["sha256"] == later["sha256"]
              with pytest.raises(ValueError, match="different metadata"):
                  record_snapshot(
                      workspace,
                      "SRC-0001",
                      b"same-bytes",
                      media_type="application/octet-stream",
                      retrieved_at="2026-08-02T01:00:00Z",
                  )
          '''
          tests = replace_function(tests, "test_snapshot_manifest_conflict_is_immutable", replacement)
          adversarial_tests.write_text(tests, encoding="utf-8")
          PY
      - run: python -m ruff format src/neuroai_workbench/monitoring.py tests/unit/test_monitoring.py tests/unit/test_monitoring_adversarial.py
      - run: python -m ruff check src/neuroai_workbench/monitoring.py tests/unit/test_monitoring.py tests/unit/test_monitoring_adversarial.py
      - run: python -m pytest tests/unit/test_monitoring.py tests/unit/test_monitoring_adversarial.py tests/unit/test_monitoring_cli.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/neuroai_workbench/monitoring.py tests/unit/test_monitoring.py tests/unit/test_monitoring_adversarial.py
          git commit -m "Harden monitoring capture identity and ingestion"
          git push origin HEAD:agent/observatory-operations-foundation
