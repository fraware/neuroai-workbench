name: Temporary apply hardened monitoring

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: temporary-apply-hardened-monitoring
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/observatory-operations-foundation
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --require-hashes -r requirements/constraints.txt
      - name: Extract and execute corrected hardening transformation
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path(".github/workflows/_temporary-harden-monitoring.yml")
          text = workflow.read_text(encoding="utf-8")
          text = text.replace("from textwrap import dedent\n", "from textwrap import dedent, indent\n", 1)
          text = text.replace("          url_block = dedent(\n", "          url_block = indent(dedent(\n", 1)
          closing = "\n          )\n          text = text[:url_start] + url_block + text[url_end:]"
          replacement = "\n          ), \"        \")\n          text = text[:url_start] + url_block + text[url_end:]"
          if closing not in text:
              raise SystemExit("expected URL-block closing marker not found")
          text = text.replace(closing, replacement, 1)

          marker = "          python - <<'PY'\n"
          start = text.index(marker) + len(marker)
          end = text.index("\n          PY\n", start)
          script = dedent(text[start:end])
          compile(script, "apply_monitoring_hardening.py", "exec")
          Path("/tmp/apply_monitoring_hardening.py").write_text(script, encoding="utf-8")
          PY
          python /tmp/apply_monitoring_hardening.py
      - run: python -m ruff format src/neuroai_workbench/monitoring.py tests/unit/test_monitoring.py tests/unit/test_monitoring_adversarial.py
      - run: python -m ruff check src/neuroai_workbench/monitoring.py tests/unit/test_monitoring.py tests/unit/test_monitoring_adversarial.py
      - run: python -m mypy src/neuroai_workbench/monitoring.py src/neuroai_workbench/monitoring_cli.py
      - run: python -m pytest tests/unit/test_monitoring.py tests/unit/test_monitoring_adversarial.py tests/unit/test_monitoring_cli.py
      - name: Commit hardened implementation and remove temporary workflows
        run: |
          rm .github/workflows/_temporary-harden-monitoring.yml
          rm .github/workflows/_temporary-apply-hardened-monitoring.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/neuroai_workbench/monitoring.py tests/unit/test_monitoring.py tests/unit/test_monitoring_adversarial.py
          git add -u .github/workflows
          git commit -m "Harden monitoring capture identity and ingestion"
          git push origin HEAD:agent/observatory-operations-foundation
