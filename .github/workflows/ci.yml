name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --require-hashes -r requirements/constraints.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m mypy src/neuroai_workbench
      - run: python -m compileall -q src scripts
      - run: node --check src/neuroai_workbench/static/i18n.js
      - run: node --check src/neuroai_workbench/static/accessibility.js
      - run: node --check src/neuroai_workbench/static/app.js
      - run: node --check src/neuroai_workbench/static/review.js
      - run: node --test tests/js/test_accessibility.js
      - run: python scripts/check_repository_hygiene.py
      - run: python scripts/check_github_workflow_contract.py
      - run: python scripts/check_version_consistency.py
      - run: python scripts/agent_eval_harness.py

  tests:
    name: tests-python-${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --require-hashes -r requirements/constraints.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest --cov=neuroai_workbench --cov-report=term-missing --cov-report=xml --cov-report=json --cov-fail-under=90
      - run: python scripts/check_module_coverage.py --coverage-json coverage.json
      - run: python scripts/check_workbook_reproducibility.py
      - run: python scripts/check_publication_reproducibility.py
      - if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --require-hashes -r requirements/constraints.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: neuroai-workbench --version
      - run: neuroai-workbench doctor
      - run: python scripts/check_package_contents.py dist/*.whl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  release-verification:
    name: release-verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --require-hashes -r requirements/constraints.txt
      - run: python -m pip install --no-deps -e .
      - run: mkdir -p artifacts
      - run: python scripts/verify_release.py --ci --output artifacts/RELEASE_VERIFICATION.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-verification
          path: artifacts/RELEASE_VERIFICATION.json
          if-no-files-found: error

  container:
    name: container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker build --tag neuroai-workbench:ci .
      - run: mkdir -p "$RUNNER_TEMP/workspace" && chmod 0777 "$RUNNER_TEMP/workspace"
      - name: Default loopback image smoke
        run: |
          docker run -d --rm --name neuroai-workbench-ci \
            -v "$RUNNER_TEMP/workspace:/workspace" \
            neuroai-workbench:ci
          for attempt in {1..30}; do
            if docker exec neuroai-workbench-ci python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health')" ; then
              docker stop neuroai-workbench-ci
              exit 0
            fi
            sleep 1
          done
          docker logs neuroai-workbench-ci
          docker stop neuroai-workbench-ci || true
          exit 1
      - name: Explicit network profile smoke
        run: |
          docker run -d --rm --name neuroai-workbench-ci-net \
            -e NEUROAI_ALLOW_NETWORK=1 \
            -p 127.0.0.1:8765:8765 \
            -v "$RUNNER_TEMP/workspace:/workspace" \
            neuroai-workbench:ci \
            serve /workspace --host 0.0.0.0 --port 8765 --allow-network
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8765/api/health && exit 0
            sleep 1
          done
          docker logs neuroai-workbench-ci-net
          exit 1
      - run: curl --fail --silent http://127.0.0.1:8765/ | grep -q "NeuroAI Evidence and Decision Workbench"
      - if: always()
        run: docker stop neuroai-workbench-ci-net || true

  product-native:
    name: product-native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --require-hashes -r requirements/constraints.txt
      - run: python -m pip install --no-deps -e .
      - name: Assert hashed product extras importable
        run: |
          python -c "import openpyxl, docx, reportlab; print('openpyxl', openpyxl.__version__); print('python-docx', docx.__version__); print('reportlab', reportlab.Version)"
      - name: Native XLSX/DOCX/PDF structure
        run: |
          python -m pytest tests/unit/test_products_native.py tests/unit/test_products_excel.py tests/unit/test_products_excel_reproducibility.py tests/unit/test_products_publication_reproducibility.py tests/unit/test_products_reconciliation.py -q

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --require-hashes -r requirements/constraints.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pip_audit -r requirements/constraints.txt
