name: Rebuild issue 111 on current main

on:
  push:
    branches:
      - agent/111-owner-dispositions

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/111-owner-dispositions
          fetch-depth: 0
      - name: Restore isolated issue 111 surface
        run: |
          git fetch origin archive/111-owner-dispositions-5338a970
          git restore --source=origin/archive/111-owner-dispositions-5338a970 -- \
            docs/reference/governance-owner-dispositions.md \
            src/neuroai_workbench/governance_dispositions.py \
            src/neuroai_workbench/resources/operations/GOVERNANCE_OWNER_DISPOSITION.schema.json \
            tests/unit/test_governance_dispositions.py \
            tests/unit/test_governance_dispositions_adversarial.py
      - name: Apply type-safety and current-main coverage contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/neuroai_workbench/governance_dispositions.py')
          text = path.read_text(encoding='utf-8')

          old = '''    else:\n        for record in active:\n            active_ids = {\n                str(item.get("opinion_id")) for item in record.get("addressed_opinions", []) if isinstance(item, dict)\n            }\n'''
          new = '''    else:\n        for active_record in active:\n            active_ids = {\n                str(item.get("opinion_id"))\n                for item in active_record.get("addressed_opinions", [])\n                if isinstance(item, dict)\n            }\n'''
          if old not in text:
              raise SystemExit('active-disposition rename anchor missing')
          text = text.replace(old, new, 1)

          old = '''            for condition_id in sorted(set(prior_conditions) & set(current_conditions)):\n                prior = prior_conditions[condition_id]\n                current = current_conditions[condition_id]\n                for field in ("description", "owner", "priority", "release_effect"):\n                    if prior.get(field) != current.get(field):\n'''
          new = '''            for condition_id in sorted(set(prior_conditions) & set(current_conditions)):\n                prior = prior_conditions[condition_id]\n                current_condition = current_conditions[condition_id]\n                for field in ("description", "owner", "priority", "release_effect"):\n                    if prior.get(field) != current_condition.get(field):\n'''
          if old not in text:
              raise SystemExit('condition rename anchor missing')
          text = text.replace(old, new, 1)

          old = '''    for start in sorted(graph):\n        seen: set[str] = set()\n        current = start\n        while current in graph:\n            if current in seen:\n                errors.append(f"disposition {start}: supersession cycle detected")\n                break\n            seen.add(current)\n            current = graph[current]\n'''
          new = '''    for start in sorted(graph):\n        seen: set[str] = set()\n        cursor = start\n        while cursor in graph:\n            if cursor in seen:\n                errors.append(f"disposition {start}: supersession cycle detected")\n                break\n            seen.add(cursor)\n            cursor = graph[cursor]\n'''
          if old not in text:
              raise SystemExit('graph cursor rename anchor missing')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          coverage = Path('scripts/check_module_coverage.py')
          ctext = coverage.read_text(encoding='utf-8')
          line = '    "neuroai_workbench/governance_dispositions.py": 95.0,\n'
          if line not in ctext:
              anchor = '    "neuroai_workbench/governance_opinions.py": 95.0,\n'
              if anchor not in ctext:
                  raise SystemExit('module coverage anchor missing')
              ctext = ctext.replace(anchor, anchor + line, 1)
              coverage.write_text(ctext, encoding='utf-8')
          PY
      - name: Commit rebuilt issue 111 surface
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/reference/governance-owner-dispositions.md \
            scripts/check_module_coverage.py \
            src/neuroai_workbench/governance_dispositions.py \
            src/neuroai_workbench/resources/operations/GOVERNANCE_OWNER_DISPOSITION.schema.json \
            tests/unit/test_governance_dispositions.py \
            tests/unit/test_governance_dispositions_adversarial.py
          git commit -m 'Rebuild owner dispositions on current main'
          git push origin HEAD:agent/111-owner-dispositions
