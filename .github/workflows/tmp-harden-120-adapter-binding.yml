name: Temporary issue 120 adapter binding hardening

on:
  push:
    branches:
      - agent/120-comparative-live-refresh
    paths:
      - .github/workflows/tmp-harden-120-adapter-binding.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/120-comparative-live-refresh
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install --require-hashes -r requirements/constraints.txt
      - run: python -m pip install --no-deps -e .
      - name: Bind comparisons to adapter identity and implementation version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("src/neuroai_workbench/shadow_refresh/comparative.py")
          test_path = Path("tests/unit/test_shadow_comparative_refresh.py")
          source = source_path.read_text(encoding="utf-8")
          tests = test_path.read_text(encoding="utf-8")

          marker = '''def _quarantine_by_result(quarantine_root: Path) -> dict[str, dict[str, Any]]:\n'''
          helper = '''def _collection_outcome_index(package: dict[str, Any]) -> dict[str, dict[str, Any]]:\n    collection_run = _mapping(package.get("collection_run"))\n    outcomes = _items(collection_run.get("outcomes"))\n    by_source: dict[str, dict[str, Any]] = {}\n    for ordinal, raw in enumerate(outcomes):\n        if not isinstance(raw, dict):\n            raise ValueError(f"Collection outcome[{ordinal}] must be an object")\n        source_id = str(raw.get("source_id") or "")\n        if not source_id:\n            raise ValueError(f"Collection outcome[{ordinal}] lacks source identity")\n        if source_id in by_source:\n            raise ValueError(f"Ambiguous collection outcome: duplicate source {source_id}")\n        by_source[source_id] = raw\n    return by_source\n\n\n'''
          if source.count(marker) != 1:
              raise SystemExit("Refusing helper insertion: marker not unique")
          source = source.replace(marker, helper + marker)

          old_seed = '''    capture_by_source = _capture_index(summary)\n    record_by_result = _quarantine_by_result(baseline_quarantine_root)\n'''
          new_seed = '''    capture_by_source = _capture_index(summary)\n    outcome_by_source = _collection_outcome_index(summary)\n    record_by_result = _quarantine_by_result(baseline_quarantine_root)\n'''
          if source.count(old_seed) != 1:
              raise SystemExit("Refusing baseline outcome-index patch")
          source = source.replace(old_seed, new_seed)

          old_seed_verify = '''        if str(result.get("monitor_id") or "") != str(source_record.get("monitor_id") or ""):\n            raise ValueError(f"Baseline reviewed registry monitor mismatch for {source_id}")\n        snapshot = record_snapshot(\n'''
          new_seed_verify = '''        if str(result.get("monitor_id") or "") != str(source_record.get("monitor_id") or ""):\n            raise ValueError(f"Baseline reviewed registry monitor mismatch for {source_id}")\n        collection_outcome = outcome_by_source.get(source_id)\n        if collection_outcome is None:\n            raise ValueError(f"Baseline collection outcome missing for {source_id}")\n        if collection_outcome.get("status") != "RESULT" or str(collection_outcome.get("record_id") or "") != result_id:\n            raise ValueError(f"Baseline collection outcome/result binding mismatch for {source_id}")\n        adapter_id = str(collection_outcome.get("adapter_id") or "")\n        if not adapter_id:\n            raise ValueError(f"Baseline adapter identity missing for {source_id}")\n        snapshot = record_snapshot(\n'''
          if source.count(old_seed_verify) != 1:
              raise SystemExit("Refusing baseline adapter verification patch")
          source = source.replace(old_seed_verify, new_seed_verify)

          old_seed_row = '''                "collector_version": result.get("collector_version"),\n                "collector_configuration_hash": result.get("configuration_hash"),\n'''
          new_seed_row = '''                "adapter_id": adapter_id,\n                "collector_version": result.get("collector_version"),\n                "collector_configuration_hash": result.get("configuration_hash"),\n'''
          if source.count(old_seed_row) != 1:
              raise SystemExit("Refusing baseline row adapter patch")
          source = source.replace(old_seed_row, new_seed_row)

          old_signature = '''    older_collector_configuration_hash: str | None,\n    newer_collector_configuration_hash: str | None,\n) -> dict[str, Any]:\n'''
          new_signature = '''    older_collector_configuration_hash: str | None,\n    newer_collector_configuration_hash: str | None,\n    older_adapter_id: str | None = None,\n    newer_adapter_id: str | None = None,\n    older_collector_version: str | None = None,\n    newer_collector_version: str | None = None,\n) -> dict[str, Any]:\n'''
          if source.count(old_signature) != 1:
              raise SystemExit("Refusing classify signature patch")
          source = source.replace(old_signature, new_signature)

          old_binding = '''        "collector_configuration": {\n            "older": older_collector_configuration_hash,\n            "newer": newer_collector_configuration_hash,\n            "same": older_collector_configuration_hash == newer_collector_configuration_hash,\n        },\n'''
          new_binding = '''        "adapter_binding": {\n            "older_id": older_adapter_id,\n            "newer_id": newer_adapter_id,\n            "same_adapter": older_adapter_id == newer_adapter_id,\n            "older_implementation_version": older_collector_version,\n            "newer_implementation_version": newer_collector_version,\n            "same_implementation_version": older_collector_version == newer_collector_version,\n        },\n        "collector_configuration": {\n            "older": older_collector_configuration_hash,\n            "newer": newer_collector_configuration_hash,\n            "same": older_collector_configuration_hash == newer_collector_configuration_hash,\n        },\n'''
          if source.count(old_binding) != 1:
              raise SystemExit("Refusing comparison adapter-binding patch")
          source = source.replace(old_binding, new_binding)

          old_current = '''    current_result_by_source: dict[str, dict[str, Any]] = {}\n    for digest in _items(live_package.get("capture_digests")):\n'''
          new_current = '''    current_result_by_source: dict[str, dict[str, Any]] = {}\n    current_outcome_by_source = _collection_outcome_index(live_package)\n    for digest in _items(live_package.get("capture_digests")):\n'''
          if source.count(old_current) != 1:
              raise SystemExit("Refusing current outcome-index patch")
          source = source.replace(old_current, new_current)

          old_call = '''            current_result = current_result_by_source[source_id]\n            detailed = classify_capture_pair(\n                evaluation_workspace=evaluation_workspace,\n                source_id=source_id,\n                older_snapshot_id=str(previous_id),\n                newer_snapshot_id=current_id,\n                older_collector_configuration_hash=baseline_row.get("collector_configuration_hash"),\n                newer_collector_configuration_hash=(\n                    str(current_result.get("configuration_hash")) if current_result.get("configuration_hash") else None\n                ),\n            )\n'''
          new_call = '''            current_result = current_result_by_source[source_id]\n            current_outcome = current_outcome_by_source.get(source_id)\n            if current_outcome is None or current_outcome.get("status") != "RESULT":\n                raise ValueError(f"Current collection outcome missing successful adapter binding for {source_id}")\n            if str(current_outcome.get("record_id") or "") != str(current_result.get("result_id") or ""):\n                raise ValueError(f"Current collection outcome/result binding mismatch for {source_id}")\n            current_adapter_id = str(current_outcome.get("adapter_id") or "")\n            if not current_adapter_id:\n                raise ValueError(f"Current adapter identity missing for {source_id}")\n            detailed = classify_capture_pair(\n                evaluation_workspace=evaluation_workspace,\n                source_id=source_id,\n                older_snapshot_id=str(previous_id),\n                newer_snapshot_id=current_id,\n                older_collector_configuration_hash=baseline_row.get("collector_configuration_hash"),\n                newer_collector_configuration_hash=(\n                    str(current_result.get("configuration_hash")) if current_result.get("configuration_hash") else None\n                ),\n                older_adapter_id=str(baseline_row.get("adapter_id") or ""),\n                newer_adapter_id=current_adapter_id,\n                older_collector_version=str(baseline_row.get("collector_version") or ""),\n                newer_collector_version=str(current_result.get("collector_version") or ""),\n            )\n'''
          if source.count(old_call) != 1:
              raise SystemExit("Refusing current adapter call patch")
          source = source.replace(old_call, new_call)

          old_public = '''                    "classification",\n                    "normalization_version",\n                    "collector_configuration",\n'''
          new_public = '''                    "classification",\n                    "normalization_version",\n                    "adapter_binding",\n                    "collector_configuration",\n'''
          if source.count(old_public) != 1:
              raise SystemExit("Refusing public adapter-binding patch")
          source = source.replace(old_public, new_public)
          source_path.write_text(source, encoding="utf-8")

          old_assert = '''    assert report["execution"]["true_comparison_count"] == 1\n    assert report["execution"]["comparison_classification_counts"] == {"SUBSTANTIVE_NORMALIZED_TEXT_CHANGE": 1}\n'''
          new_assert = '''    assert report["execution"]["true_comparison_count"] == 1\n    assert report["execution"]["comparison_classification_counts"] == {"SUBSTANTIVE_NORMALIZED_TEXT_CHANGE": 1}\n    adapter_binding = report["comparisons"][0]["adapter_binding"]\n    assert adapter_binding["older_id"]\n    assert adapter_binding["newer_id"]\n    assert adapter_binding["same_adapter"] is True\n    assert adapter_binding["older_implementation_version"] == "0.3.0.dev0-live-shadow"\n    assert adapter_binding["newer_implementation_version"] == "0.3.0.dev0-live-shadow"\n    assert adapter_binding["same_implementation_version"] is True\n'''
          if tests.count(old_assert) != 1:
              raise SystemExit("Refusing adapter assertion patch")
          tests = tests.replace(old_assert, new_assert)
          test_path.write_text(tests, encoding="utf-8")
          PY
      - name: Validate adapter binding hardening
        run: |
          python -m ruff format src/neuroai_workbench/shadow_refresh/comparative.py tests/unit/test_shadow_comparative_refresh.py
          python -m ruff format --check src/neuroai_workbench/shadow_refresh/comparative.py tests/unit/test_shadow_comparative_refresh.py
          python -m ruff check src/neuroai_workbench/shadow_refresh/comparative.py tests/unit/test_shadow_comparative_refresh.py
          python -m pytest tests/unit/test_shadow_comparative_refresh.py -q
          python -m mypy src/neuroai_workbench/shadow_refresh/comparative.py
          python -m compileall -q src/neuroai_workbench/shadow_refresh/comparative.py
      - name: Remove temporary workflow and commit only validated hardening
        shell: bash
        run: |
          git rm .github/workflows/tmp-harden-120-adapter-binding.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/neuroai_workbench/shadow_refresh/comparative.py tests/unit/test_shadow_comparative_refresh.py
          git diff --cached --check
          git commit -m "fix: bind comparative records to adapter identity"
          git push origin HEAD:agent/120-comparative-live-refresh