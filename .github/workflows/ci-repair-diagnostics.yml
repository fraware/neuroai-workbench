name: CI repair diagnostics

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --require-hashes -r requirements/constraints.txt
      - run: python -m pip install --no-deps -e .
      - name: Generate exact Ruff formatting patch
        run: |
          python -m ruff format .
          git diff --check
          git diff --binary > ruff-format.patch
          git diff --name-only -z | tar --null -T - -czf ruff-formatted-files.tar.gz
      - name: Generate complete coverage diagnostics
        run: |
          python -m pytest \
            --cov=neuroai_workbench \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=json \
            --cov-fail-under=0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-repair-diagnostics
          path: |
            ruff-format.patch
            ruff-formatted-files.tar.gz
            coverage.json
            coverage.xml
          if-no-files-found: error
          retention-days: 7
