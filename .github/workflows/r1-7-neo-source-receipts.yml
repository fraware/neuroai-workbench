name: R1.7 NEO public source digest research

on:
  pull_request:
    paths:
      - "scripts/r1_7_neo_public_http_receipts.py"
      - "tests/unit/test_r1_7_neo_public_http_receipts.py"
      - "docs/programme/r1-7-neo-china-multilingual-regulatory-and-clinical-evidence-2026-10-22.json"
      - ".github/workflows/r1-7-neo-source-receipts.yml"

permissions:
  contents: read

jobs:
  public-source-receipts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read exactly three fixed public regulator sources, hash in memory
        run: |
          python scripts/r1_7_neo_public_http_receipts.py \
            --output "$RUNNER_TEMP/neo-primary-http-receipts.json"
      - name: Preserve digest-only receipt report
        uses: actions/upload-artifact@v4
        with:
          name: neo-public-http-digest-receipts
          path: ${{ runner.temp }}/neo-primary-http-receipts.json
          retention-days: 30
          if-no-files-found: error
