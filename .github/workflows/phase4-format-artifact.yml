name: Phase 4 formatting artifact

on:
  pull_request:
    paths:
      - "src/neuroai_workbench/science_observatory/acquisition.py"
      - ".github/workflows/phase4-format-artifact.yml"

permissions:
  contents: read

env:
  FORMAT_REF: ${{ github.event.pull_request.head.sha }}

jobs:
  format_artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.FORMAT_REF }}
          persist-credentials: false
      - name: Assert exact source commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FORMAT_REF"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install locked formatter
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements/constraints.txt
      - name: Format acquisition module
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff format src/neuroai_workbench/science_observatory/acquisition.py
          python -m ruff format --check src/neuroai_workbench/science_observatory/acquisition.py
      - name: Upload formatted acquisition module
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: phase4-formatted-acquisition
          path: src/neuroai_workbench/science_observatory/acquisition.py
          if-no-files-found: error
          retention-days: 1
