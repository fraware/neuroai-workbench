name: Temporary issue 120 CI fixture repair

on:
  push:
    branches:
      - agent/120-comparative-live-refresh
    paths:
      - .github/workflows/tmp-fix-120-ci.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/120-comparative-live-refresh
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install --require-hashes -r requirements/constraints.txt
      - run: python -m pip install --no-deps -e .
      - name: Apply exact fixture and lint repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          test_path = Path("tests/unit/test_shadow_comparative_refresh.py")
          source_path = Path("src/neuroai_workbench/shadow_refresh/comparative.py")

          test_text = test_path.read_text(encoding="utf-8")
          replacements = [
              (
                  '"url": f"https://example.org/source-{index}",',
                  '"url": f"https://pages.example.org/source-{index}",',
                  1,
              ),
              (
                  'registry={"metadata": {"version": "test"}, "sources": registry},',
                  'registry={"sources": registry},',
                  1,
              ),
              (
                  'atomic_write_json(path, {"metadata": {"version": "test"}, "sources": registry})',
                  'atomic_write_json(path, registry)',
                  1,
              ),
          ]
          for old, new, expected in replacements:
              observed = test_text.count(old)
              if observed != expected:
                  raise SystemExit(f"Refusing fixture patch: expected {expected} occurrence(s) of {old!r}, found {observed}")
              test_text = test_text.replace(old, new)
          test_path.write_text(test_text, encoding="utf-8")

          source_text = source_path.read_text(encoding="utf-8")
          old_import = "    load_collection_result,\n    load_quarantine_record,\n"
          new_import = "    load_collection_result,\n"
          observed = source_text.count(old_import)
          if observed != 1:
              raise SystemExit(f"Refusing source patch: expected one unused-import block, found {observed}")
          source_path.write_text(source_text.replace(old_import, new_import), encoding="utf-8")
          PY
      - name: Validate focused repair
        run: |
          python -m ruff format --check src/neuroai_workbench/shadow_refresh/comparative.py tests/unit/test_shadow_comparative_refresh.py
          python -m ruff check src/neuroai_workbench/shadow_refresh/comparative.py tests/unit/test_shadow_comparative_refresh.py
          python -m pytest tests/unit/test_shadow_comparative_refresh.py -q
      - name: Remove temporary workflow and commit only validated repair
        shell: bash
        run: |
          git rm .github/workflows/tmp-fix-120-ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/neuroai_workbench/shadow_refresh/comparative.py tests/unit/test_shadow_comparative_refresh.py
          git diff --cached --check
          git commit -m "test: repair comparative refresh CI fixtures"
          git push origin HEAD:agent/120-comparative-live-refresh