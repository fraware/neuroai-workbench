name: Bind governance scope events

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  bind:
    name: bind
    if: github.event.pull_request.head.ref == 'agent/governance-reviewer-opinions' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/governance-reviewer-opinions
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --require-hashes -r requirements/constraints.txt
      - run: python -m pip install --no-deps -e .
      - name: Enforce governance scope event binding
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if text.count(old) != 1:
                  raise SystemExit(f"{label} was not found exactly once")
              return text.replace(old, new)

          source = Path("src/neuroai_workbench/governance_opinions.py")
          text = source.read_text(encoding="utf-8")
          text = replace_once(
              text,
              "from .governance_scope import load_governance_scope_manifests\n",
              "from .governance_scope import GOVERNANCE_SCOPE_BOUNDARY, load_governance_scope_manifests\n",
              "governance scope import",
          )
          old = '''def _scope_records_by_id(workspace: Workspace) -> dict[str, dict[str, Any]]:\n    scopes: dict[str, dict[str, Any]] = {}\n    for scope in load_governance_scope_manifests(workspace):\n        scope_id = str(scope.get("scope_id", ""))\n        if not scope_id:\n            raise ValueError("Governance scope record is missing scope_id")\n        unsupported_private = sorted(key for key in scope if key.startswith("_") and key not in RUNTIME_PRIVATE_KEYS)\n        if unsupported_private:\n            raise ValueError(f"Governance scope {scope_id} contains unsupported private fields {unsupported_private}")\n        if scope.get("manifest_sha256") != _scope_manifest_sha256(scope):\n            raise ValueError(f"Governance scope {scope_id} failed canonical hash verification")\n        if scope.get("release_authorization_performed") is not False:\n            raise ValueError(f"Governance scope {scope_id} must remain non-authorizing")\n        if scope_id in scopes:\n            raise ValueError(f"Duplicate governance scope ID {scope_id}")\n        scopes[scope_id] = scope\n    return scopes\n'''
          new = '''def _scope_records_by_id(workspace: Workspace) -> dict[str, dict[str, Any]]:\n    events = load_events(workspace.root / "events.jsonl")\n    scope_events: Counter[tuple[str, str]] = Counter(\n        (\n            str(event.get("payload", {}).get("scope_id")),\n            str(event.get("payload", {}).get("manifest_sha256")),\n        )\n        for event in events\n        if event.get("action") == "GOVERNANCE_SCOPE_RECORDED"\n        and isinstance(event.get("payload"), dict)\n    )\n    scopes: dict[str, dict[str, Any]] = {}\n    for scope in load_governance_scope_manifests(workspace):\n        scope_id = str(scope.get("scope_id", ""))\n        if not scope_id:\n            raise ValueError("Governance scope record is missing scope_id")\n        unsupported_private = sorted(\n            key for key in scope if key.startswith("_") and key not in RUNTIME_PRIVATE_KEYS\n        )\n        if unsupported_private:\n            raise ValueError(\n                f"Governance scope {scope_id} contains unsupported private fields {unsupported_private}"\n            )\n        manifest_sha256 = str(scope.get("manifest_sha256", ""))\n        if manifest_sha256 != _scope_manifest_sha256(scope):\n            raise ValueError(f"Governance scope {scope_id} failed canonical hash verification")\n        if scope.get("schema_version") != "1":\n            raise ValueError(f"Governance scope {scope_id} has unsupported schema version")\n        if scope.get("authority_profile") != "SCOPE_INTEGRITY_ONLY":\n            raise ValueError(f"Governance scope {scope_id} has an invalid authority profile")\n        if scope.get("boundary") != GOVERNANCE_SCOPE_BOUNDARY:\n            raise ValueError(f"Governance scope {scope_id} has an invalid authority boundary")\n        if scope.get("release_authorization_performed") is not False:\n            raise ValueError(f"Governance scope {scope_id} must remain non-authorizing")\n        event_count = scope_events[(scope_id, manifest_sha256)]\n        if event_count == 0:\n            raise ValueError(f"Governance scope {scope_id} has no matching append-only event")\n        if event_count > 1:\n            raise ValueError(\n                f"Governance scope {scope_id} has {event_count} matching append-only events"\n            )\n        if scope_id in scopes:\n            raise ValueError(f"Duplicate governance scope ID {scope_id}")\n        scopes[scope_id] = scope\n    return scopes\n'''
          text = replace_once(text, old, new, "governance scope index")
          source.write_text(text, encoding="utf-8")

          tests = Path("tests/unit/test_governance_opinions.py")
          test_text = tests.read_text(encoding="utf-8")
          if "def test_scope_event_and_authority_binding_fail_closed" not in test_text:
              test_text += '''\n\ndef test_scope_event_and_authority_binding_fail_closed(tmp_path: Path) -> None:\n    workspace, scope = _scope(tmp_path / "recomputed")\n    scope_path = next((workspace.root / "governance" / "scopes").glob("*.json"))\n    stored = json.loads(scope_path.read_text(encoding="utf-8"))\n    stored["scope_label"] = "Recomputed tampered scope"\n    stored["manifest_sha256"] = _scope_manifest_sha256(stored)\n    atomic_write_json(scope_path, stored)\n    with pytest.raises(ValueError, match="no matching append-only event"):\n        _scope_records_by_id(workspace)\n    with pytest.raises(ValueError, match="no matching append-only event"):\n        _record(workspace, stored)\n\n    workspace, scope = _scope(tmp_path / "duplicate-event")\n    append_event(\n        workspace.root / "events.jsonl",\n        "GOVERNANCE_SCOPE_RECORDED",\n        "local-user",\n        {\n            "scope_id": scope["scope_id"],\n            "manifest_sha256": scope["manifest_sha256"],\n            "object_count": len(scope["objects"]),\n            "release_authorization_performed": False,\n        },\n    )\n    with pytest.raises(ValueError, match="2 matching append-only events"):\n        _scope_records_by_id(workspace)\n\n    mutations = [\n        ("schema", "schema_version", "2", "unsupported schema version"),\n        ("profile", "authority_profile", "RELEASE_AUTHORITY", "invalid authority profile"),\n        ("boundary", "boundary", "authorizes release", "invalid authority boundary"),\n    ]\n    for suffix, field, value, message in mutations:\n        workspace, _ = _scope(tmp_path / suffix)\n        path = next((workspace.root / "governance" / "scopes").glob("*.json"))\n        record = json.loads(path.read_text(encoding="utf-8"))\n        record[field] = value\n        record["manifest_sha256"] = _scope_manifest_sha256(record)\n        atomic_write_json(path, record)\n        with pytest.raises(ValueError, match=message):\n            _scope_records_by_id(workspace)\n'''
          tests.write_text(test_text, encoding="utf-8")
          PY
      - run: python -m ruff format src/neuroai_workbench/governance_opinions.py tests/unit/test_governance_opinions.py
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m pytest tests/unit/test_governance_opinions.py --cov=neuroai_workbench.governance_opinions --cov-report=term-missing --cov-fail-under=95
      - run: python scripts/check_github_workflow_contract.py
      - name: Commit exact scope-event binding changes
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/neuroai_workbench/governance_opinions.py tests/unit/test_governance_opinions.py
          git commit -m "Bind opinions to governance scope events"
          git push origin HEAD:agent/governance-reviewer-opinions
