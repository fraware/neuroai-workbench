name: Temporary issue 120 semantic hardening

on:
  push:
    branches:
      - agent/120-comparative-live-refresh
    paths:
      - .github/workflows/tmp-harden-120-semantics.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/120-comparative-live-refresh
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install --require-hashes -r requirements/constraints.txt
      - run: python -m pip install --no-deps -e .
      - name: Apply fail-closed issue 120 semantic hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("src/neuroai_workbench/shadow_refresh/comparative.py")
          test_path = Path("tests/unit/test_shadow_comparative_refresh.py")
          script_path = Path("scripts/run_issue120_comparative_refresh.py")

          source = source_path.read_text(encoding="utf-8")
          source_replacements = [
              (
                  "    initialize_monitoring(evaluation_workspace, registry_path, actor=actor)\n    state_path = evaluation_workspace / \"observatory\" / \"monitoring\" / \"state.json\"\n",
                  "    registry = load_source_registry(registry_path)\n    source_index = {\n        str(record[\"source_id\"]): record\n        for record in registry.get(\"sources\", [])\n        if isinstance(record, dict) and record.get(\"source_id\")\n    }\n    initialize_monitoring(evaluation_workspace, registry_path, actor=actor)\n    state_path = evaluation_workspace / \"observatory\" / \"monitoring\" / \"state.json\"\n",
                  1,
              ),
              (
                  "        result, body_path = _verify_capture_record(\n            quarantine_root=baseline_quarantine_root,\n            digest_record=digest_record,\n            quarantine_record=quarantine_record,\n        )\n        snapshot = record_snapshot(\n",
                  "        result, body_path = _verify_capture_record(\n            quarantine_root=baseline_quarantine_root,\n            digest_record=digest_record,\n            quarantine_record=quarantine_record,\n        )\n        source_record = source_index.get(source_id)\n        if source_record is None:\n            raise ValueError(f\"Verified baseline source is absent from reviewed registry: {source_id}\")\n        expected_target = _public_url(source_record.get(\"url\"))\n        observed_target = _public_url(result.get(\"requested_url\"))\n        if expected_target is None or observed_target != expected_target:\n            raise ValueError(f\"Baseline reviewed registry retrieval target mismatch for {source_id}\")\n        if str(result.get(\"monitor_id\") or \"\") != str(source_record.get(\"monitor_id\") or \"\"):\n            raise ValueError(f\"Baseline reviewed registry monitor mismatch for {source_id}\")\n        snapshot = record_snapshot(\n",
                  1,
              ),
              (
                  "            candidates.append(\n                create_change_candidate(\n                    evaluation_workspace,\n                    source_id,\n                    current_id,\n                    previous_snapshot_id=None,\n                    summary=\"First valid capture after unresolved protected #43 baseline; no live-to-live comparison is claimed.\",\n                    actor=actor,\n                )\n            )\n",
                  "",
                  1,
              ),
          ]
          for old, new, expected in source_replacements:
              observed = source.count(old)
              if observed != expected:
                  raise SystemExit(f"Refusing source patch: expected {expected} occurrence(s), found {observed}: {old[:120]!r}")
              source = source.replace(old, new)
          source_path.write_text(source, encoding="utf-8")

          tests = test_path.read_text(encoding="utf-8")
          marker = "\ndef test_baseline_seed_rejects_corrupt_or_ambiguous_capture(tmp_path: Path) -> None:\n"
          if tests.count(marker) != 1:
              raise SystemExit("Refusing test insertion: corrupt-baseline marker is not unique")
          new_test = '''\ndef test_baseline_seed_rejects_reviewed_registry_target_drift(tmp_path: Path) -> None:\n    registry = _registry()\n    registry_path = tmp_path / "registry.json"\n    _write_registry(registry_path, registry)\n    plan = _plan(registry)\n    quarantine = tmp_path / "baseline-q"\n    package = _collect(\n        registry_path=registry_path,\n        registry=registry,\n        plan=plan,\n        quarantine_root=quarantine,\n        bodies={"SRC-0001": b"<html>baseline</html>"},\n    )\n    summary_path = tmp_path / "baseline-summary.json"\n    atomic_write_json(summary_path, package)\n\n    drifted = [dict(registry[0])]\n    drifted[0]["url"] = "https://pages.example.org/moved-source"\n    _write_registry(registry_path, drifted)\n    with pytest.raises(ValueError, match="reviewed registry retrieval target mismatch"):\n        seed_verified_baselines(\n            evaluation_workspace=tmp_path / "ws-drift",\n            registry_path=registry_path,\n            baseline_quarantine_root=quarantine,\n            baseline_summary_path=summary_path,\n        )\n\n'''
          tests = tests.replace(marker, new_test + marker)
          old_assert = '''    assert by_source["SRC-0002"]["outcome_type"] == "MANUAL_FIRST_CAPTURE"\n    assert package["stats"]["candidates"]["generated"] == 1\n'''
          new_assert = '''    assert by_source["SRC-0002"]["outcome_type"] == "MANUAL_FIRST_CAPTURE"\n    assert package["stats"]["candidates"]["generated"] == 0\n    assert package["stage_results"]["development_disposition"]["count"] == 0\n'''
          if tests.count(old_assert) != 1:
              raise SystemExit("Refusing first-capture assertion patch: expected block not unique")
          tests = tests.replace(old_assert, new_assert)
          test_path.write_text(tests, encoding="utf-8")

          script = script_path.read_text(encoding="utf-8")
          old_args = '''    parser.add_argument("--expected-predecessor-sha256")\n    parser.add_argument("--expected-baseline-summary-sha256")\n'''
          new_args = '''    parser.add_argument("--expected-predecessor-sha256")\n    parser.add_argument("--expected-baseline-summary-sha256")\n    parser.add_argument("--expected-registry-sha256")\n    parser.add_argument("--expected-plan-sha256")\n'''
          if script.count(old_args) != 1:
              raise SystemExit("Refusing runner argument patch: expected block not unique")
          script = script.replace(old_args, new_args)
          old_checks = '''    if args.expected_baseline_summary_sha256 and sha256_file(baseline_summary) != args.expected_baseline_summary_sha256:\n        raise ValueError("Baseline summary SHA-256 does not match the issue #120 execution contract")\n\n    plan = _load_object(plan_path, "Reviewed plan")\n'''
          new_checks = '''    if args.expected_baseline_summary_sha256 and sha256_file(baseline_summary) != args.expected_baseline_summary_sha256:\n        raise ValueError("Baseline summary SHA-256 does not match the issue #120 execution contract")\n    if args.expected_registry_sha256 and sha256_file(registry) != args.expected_registry_sha256:\n        raise ValueError("Operational registry SHA-256 does not match the issue #120 execution contract")\n    if args.expected_plan_sha256 and sha256_file(plan_path) != args.expected_plan_sha256:\n        raise ValueError("Reviewed plan SHA-256 does not match the issue #120 execution contract")\n\n    plan = _load_object(plan_path, "Reviewed plan")\n'''
          if script.count(old_checks) != 1:
              raise SystemExit("Refusing runner hash-gate patch: expected block not unique")
          script = script.replace(old_checks, new_checks)
          script_path.write_text(script, encoding="utf-8")
          PY
      - name: Validate semantic hardening
        run: |
          python -m ruff format src/neuroai_workbench/shadow_refresh/comparative.py tests/unit/test_shadow_comparative_refresh.py scripts/run_issue120_comparative_refresh.py
          python -m ruff format --check src/neuroai_workbench/shadow_refresh/comparative.py tests/unit/test_shadow_comparative_refresh.py scripts/run_issue120_comparative_refresh.py
          python -m ruff check src/neuroai_workbench/shadow_refresh/comparative.py tests/unit/test_shadow_comparative_refresh.py scripts/run_issue120_comparative_refresh.py
          python -m pytest tests/unit/test_shadow_comparative_refresh.py -q
          python -m mypy src/neuroai_workbench/shadow_refresh/comparative.py
          python -m compileall -q src/neuroai_workbench/shadow_refresh/comparative.py scripts/run_issue120_comparative_refresh.py
      - name: Remove temporary workflow and commit only validated hardening
        shell: bash
        run: |
          git rm .github/workflows/tmp-harden-120-semantics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/neuroai_workbench/shadow_refresh/comparative.py tests/unit/test_shadow_comparative_refresh.py scripts/run_issue120_comparative_refresh.py
          git diff --cached --check
          git commit -m "fix: bind issue 120 comparisons to reviewed inputs"
          git push origin HEAD:agent/120-comparative-live-refresh