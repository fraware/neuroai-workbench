name: Observatory monitoring plan

on:
  workflow_dispatch:
    inputs:
      as_of:
        description: Optional YYYY-MM-DD planning date
        required: false
        type: string
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: observatory-monitor-plan
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --require-hashes -r requirements/constraints.txt
      - run: python -m pip install --no-deps -e .
      - run: mkdir -p artifacts workspaces/monitor-plan
      - run: >-
          neuroai-monitor registry-validate
          examples/operations/SOURCE_MONITOR_REGISTRY_SAMPLE.json
          --out artifacts/source-registry-validation.json
      - run: >-
          neuroai-monitor init
          workspaces/monitor-plan
          examples/operations/SOURCE_MONITOR_REGISTRY_SAMPLE.json
          --out artifacts/monitor-init.json
      - name: Build due-source plan
        shell: bash
        run: |
          args=(workspaces/monitor-plan --out artifacts/monitor-plan.json)
          if [[ -n "${{ inputs.as_of }}" ]]; then
            args+=(--as-of "${{ inputs.as_of }}")
          fi
          neuroai-monitor plan "${args[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: observatory-monitor-plan
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
