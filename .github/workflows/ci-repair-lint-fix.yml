name: CI repair lint fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --require-hashes -r requirements/constraints.txt
      - name: Apply deterministic Ruff fixes
        run: |
          python -m ruff check --fix .
          python -m ruff format .
          python -m ruff check .
          python -m ruff format --check .
      - name: Commit lint fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/close_shadow_refresh_43.py \
            src/neuroai_workbench/discovery/workflow.py \
            src/neuroai_workbench/shadow_refresh/closure.py \
            tests/unit/test_shadow_closure.py
          git commit -m "style: apply repository Ruff lint fixes"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
