name: Fix operational mypy once

on:
  push:
    branches:
      - agent/153-operational-99-due-cycle
    paths:
      - .github/workflows/fix-operational-mypy-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/153-operational-99-due-cycle
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --require-hashes -r requirements/constraints.txt
      - name: Apply exact type-narrowing changes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/neuroai_workbench/collector/scheduler.py")
          text = path.read_text(encoding="utf-8")
          old_retry = '''    def _retry_delay(self, attempt_count: int) -> float:\n        return min(\n            self.collector_config.retry_max_delay_seconds,\n            self.collector_config.retry_initial_delay_seconds * (2 ** max(0, attempt_count - 1)),\n        )\n'''
          new_retry = '''    def _retry_delay(self, attempt_count: int) -> float:\n        return float(\n            min(\n                self.collector_config.retry_max_delay_seconds,\n                self.collector_config.retry_initial_delay_seconds * (2 ** max(0, attempt_count - 1)),\n            )\n        )\n'''
          old_outcome = '''            outcome = checkpoint.get("outcome") if isinstance(checkpoint.get("outcome"), dict) else {}\n            if state == "FAILURE" and outcome.get("retryable") is True:\n                retryable_final_failures += 1\n            record_id = outcome.get("record_id")\n'''
          new_outcome = '''            outcome_raw = checkpoint.get("outcome")\n            outcome: dict[str, Any] = outcome_raw if isinstance(outcome_raw, dict) else {}\n            if state == "FAILURE" and outcome.get("retryable") is True:\n                retryable_final_failures += 1\n            record_id = outcome.get("record_id")\n'''
          if old_retry not in text or old_outcome not in text:
              raise SystemExit("expected scheduler source fragments not found")
          text = text.replace(old_retry, new_retry, 1).replace(old_outcome, new_outcome, 1)
          path.write_text(text, encoding="utf-8")
          PY
          python -m ruff format src/neuroai_workbench/collector/scheduler.py
          python -m ruff check src/neuroai_workbench/collector/scheduler.py
          python -m mypy src/neuroai_workbench
      - name: Commit verified scheduler type fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/neuroai_workbench/collector/scheduler.py
          git diff --cached --check
          git commit -m "Narrow operational scheduler types for mypy"
          git push origin HEAD:agent/153-operational-99-due-cycle
