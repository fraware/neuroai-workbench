name: PR450 CodeQL SARIF diagnostic (nonpublishing)

on:
  pull_request:
    paths:
      - ".github/workflows/pr450-codeql-diagnostic.yml"
      - "scripts/r1_7_compare_review_registry.py"
      - "scripts/r1_7_composite_designation_review.py"
      - "tests/unit/test_r1_7_composite_designation_review.py"

permissions:
  contents: read
  actions: read
  packages: read

jobs:
  sarif-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          languages: python,javascript-typescript
      - uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          upload: never
          output: ${{ runner.temp }}/codeql-local-sarif
          upload-database: false
      - uses: actions/upload-artifact@v4
        with:
          name: pr450-codeql-sarif-diagnostic
          path: ${{ runner.temp }}/codeql-local-sarif
          retention-days: 7
          if-no-files-found: error
