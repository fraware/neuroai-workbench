name: Phase 4 one-shot acquisition lint fix

on:
  push:
    branches:
      - phase4-science-runtime-migration
    paths:
      - "src/neuroai_workbench/science_observatory/acquisition.py"
      - ".github/workflows/phase4-lint-fix.yml"

permissions:
  contents: write

jobs:
  lint_fix_and_commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: phase4-science-runtime-migration
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install locked linter
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements/constraints.txt
      - name: Apply safe Ruff fixes and format
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check --fix src/neuroai_workbench/science_observatory/acquisition.py
          python -m ruff format src/neuroai_workbench/science_observatory/acquisition.py
          python -m ruff format --check src/neuroai_workbench/science_observatory/acquisition.py
          python -m ruff check src/neuroai_workbench/science_observatory/acquisition.py
      - name: Commit linter output if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/neuroai_workbench/science_observatory/acquisition.py; then
            echo "No lint change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/neuroai_workbench/science_observatory/acquisition.py
          git commit -m "Fix migrated Phase 4 acquisition lint"
          git push origin HEAD:phase4-science-runtime-migration
