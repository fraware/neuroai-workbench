name: R1.7 public literature snapshot pilot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-public-pmc:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install local Workbench
        run: python -m pip install -e .
      - name: Opt-in bounded public PMC snapshot
        id: capture
        continue-on-error: true
        run: |
          python -m scripts.r1_7_capture_public_pmc \
            --count 4 \
            --allow-network \
            --output-dir "$RUNNER_TEMP/r1-7-public-pmc"
      - name: Report source acquisition state
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/r1-7-public-pmc/acquisition-report.json" ]; then
            cat "$RUNNER_TEMP/r1-7-public-pmc/acquisition-report.json"
          else
            echo "No source archive was generated; source retrieval remains incomplete"
          fi
      - name: Screen saved JATS body for nonterminal candidate mentions
        if: steps.capture.outcome == 'success'
        run: |
          python -m scripts.r1_7_screen_saved_pmc \
            --input-dir "$RUNNER_TEMP/r1-7-public-pmc" \
            --output "$RUNNER_TEMP/r1-7-public-pmc/nonterminal-mentions.json"
      - name: Upload captured public source bytes and nonterminal evidence bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1-7-public-literature-snapshots
          path: ${{ runner.temp }}/r1-7-public-pmc/
          if-no-files-found: warn
          retention-days: 30
      - name: Fail when source capture is incomplete
        if: steps.capture.outcome != 'success'
        run: |
          echo "R1.7 source capture incomplete. See acquisition report and artifact."
          exit 1
