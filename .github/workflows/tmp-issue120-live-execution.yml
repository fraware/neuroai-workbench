name: Temporary issue 120 comparative live execution

on:
  push:
    branches:
      - agent/120-comparative-live-refresh
    paths:
      - .github/workflows/tmp-issue120-live-execution.yml

permissions:
  contents: read
  actions: read

jobs:
  execute:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VALIDATED_SOFTWARE_HEAD: 83c64a9656ebff6f31556ca9ccf5cbb92685963c
      BASELINE_ARTIFACT_ID: "8865433109"
      BASELINE_ARTIFACT_NAME: protected-shadow-cycle-43
      BASELINE_ARTIFACT_SHA256: b1833340fbbd77a12af179fa1b95551c997e905776f2fcb04ac482d32b82aab9
      BASELINE_INNER_SHA256: 84d108f8bdb119a95f94b7468040cdb2388226743ef998bb839dca3834b34b9d
      BASELINE_WORKFLOW_RUN_ID: "30837442076"
      BASELINE_WORKBENCH_COMMIT: b960baa27f22e4d8d90d6873eed6f18af754af1a
      BASELINE_SUMMARY_SHA256: 478b4ac525802c7c000c1b816235a4950a87d3ff9cdf8bff309e90d0b16d05ef
      REVIEWED_PLAN_SHA256: 0a5867616b339a0940e9a4210c9f44a7efc961bbe52847d47de74b72910915e7
      OPERATIONAL_REGISTRY_SHA256: 8ff60a0e8714f38ee58f529b8df8bf8bb34fe5964cfa89a00590171dc1659910
      PREDECESSOR_SHA256: 9cc36aacb4c791c9830990b58e144f223925f3ad492016abaea44727b48a0b70
      EVIDENCE_CUTOFF: "2026-08-11"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/120-comparative-live-refresh
          fetch-depth: 0

      - name: Prove execution code equals validated software head
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$VALIDATED_SOFTWARE_HEAD" HEAD
          mapfile -t changed < <(git diff --name-only "$VALIDATED_SOFTWARE_HEAD" HEAD)
          if [[ "${#changed[@]}" -ne 1 || "${changed[0]}" != ".github/workflows/tmp-issue120-live-execution.yml" ]]; then
            printf 'Unexpected drift since validated head:\n%s\n' "${changed[*]}" >&2
            exit 1
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip

      - run: python -m pip install --require-hashes -r requirements/constraints.txt
      - run: python -m pip install --no-deps -e .

      - name: Download and cryptographically verify protected issue 43 baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/issue120"
          mkdir -p "$BASE/download" "$BASE/baseline"
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASELINE_ARTIFACT_ID}/zip" \
            -o "$BASE/download/baseline.zip"
          echo "$BASELINE_ARTIFACT_SHA256  $BASE/download/baseline.zip" | sha256sum --check --strict
          python - <<'PY'
          import hashlib
          import io
          import os
          import tarfile
          import zipfile
          from pathlib import Path, PurePosixPath

          base = Path(os.environ["RUNNER_TEMP"]) / "issue120"
          zip_path = base / "download" / "baseline.zip"
          extract_root = base / "baseline"
          expected_inner = os.environ["BASELINE_INNER_SHA256"]
          expected_names = {
              "protected-shadow-cycle-43.tar.gz",
              "protected-shadow-cycle-43.tar.gz.sha256",
          }
          with zipfile.ZipFile(zip_path) as archive:
              names = set(archive.namelist())
              if names != expected_names:
                  raise SystemExit(f"Unexpected baseline ZIP members: {sorted(names)}")
              for name in names:
                  parts = PurePosixPath(name).parts
                  if name.startswith("/") or ".." in parts:
                      raise SystemExit(f"Unsafe ZIP member: {name}")
              inner = archive.read("protected-shadow-cycle-43.tar.gz")
              sidecar = archive.read("protected-shadow-cycle-43.tar.gz.sha256").decode("utf-8")
          digest = hashlib.sha256(inner).hexdigest()
          if digest != expected_inner:
              raise SystemExit(f"Inner archive digest mismatch: {digest}")
          recorded = sidecar.split()[0]
          if recorded != expected_inner:
              raise SystemExit(f"Inner sidecar digest mismatch: {recorded}")
          with tarfile.open(fileobj=io.BytesIO(inner), mode="r:gz") as archive:
              members = archive.getmembers()
              for member in members:
                  parts = PurePosixPath(member.name).parts
                  if member.name.startswith("/") or ".." in parts or member.issym() or member.islnk():
                      raise SystemExit(f"Unsafe TAR member: {member.name}")
              archive.extractall(extract_root, filter="data")
          PY
          echo "$BASELINE_SUMMARY_SHA256  $BASE/baseline/protected/precollection-summary.json" | sha256sum --check --strict
          echo "$REVIEWED_PLAN_SHA256  $BASE/baseline/protected/reviewed-plan.json" | sha256sum --check --strict
          echo "$OPERATIONAL_REGISTRY_SHA256  $BASE/baseline/protected/operational-registry.json" | sha256sum --check --strict
          echo "$PREDECESSOR_SHA256  examples/observatory/canonical_successor_snapshot_v1.7.json" | sha256sum --check --strict

      - name: Execute exact reviewed 25-source comparative live cycle
        env:
          NEUROAI_LIVE_COLLECTION: "1"
        shell: bash
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/issue120"
          mkdir -p "$BASE/evaluation-workspace" "$BASE/current-quarantine" "$BASE/cycle-output" "$BASE/public-output"
          python scripts/run_issue120_comparative_refresh.py \
            --registry "$BASE/baseline/protected/operational-registry.json" \
            --plan "$BASE/baseline/protected/reviewed-plan.json" \
            --predecessor examples/observatory/canonical_successor_snapshot_v1.7.json \
            --baseline-quarantine-root "$BASE/baseline/protected/quarantine" \
            --baseline-summary "$BASE/baseline/protected/precollection-summary.json" \
            --evaluation-workspace "$BASE/evaluation-workspace" \
            --current-quarantine-root "$BASE/current-quarantine" \
            --output-dir "$BASE/cycle-output" \
            --public-output-dir "$BASE/public-output" \
            --refresh-version v2.3.0-dev \
            --evidence-cutoff "$EVIDENCE_CUTOFF" \
            --apply-id "issue120-${GITHUB_RUN_ID}" \
            --actor issue-120-comparative-refresh-actions \
            --baseline-artifact-id "$BASELINE_ARTIFACT_ID" \
            --baseline-artifact-name "$BASELINE_ARTIFACT_NAME" \
            --baseline-artifact-sha256 "$BASELINE_ARTIFACT_SHA256" \
            --baseline-workflow-run-id "$BASELINE_WORKFLOW_RUN_ID" \
            --baseline-workbench-commit "$BASELINE_WORKBENCH_COMMIT" \
            --expected-predecessor-sha256 "$PREDECESSOR_SHA256" \
            --expected-baseline-summary-sha256 "$BASELINE_SUMMARY_SHA256" \
            --expected-registry-sha256 "$OPERATIONAL_REGISTRY_SHA256" \
            --expected-plan-sha256 "$REVIEWED_PLAN_SHA256"

      - name: Enforce issue 120 execution invariants before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          base = Path(os.environ["RUNNER_TEMP"]) / "issue120"
          cycle = json.loads((base / "cycle-output" / "evaluation-cycle-report.json").read_text(encoding="utf-8"))
          report = json.loads((base / "public-output" / "comparative-refresh-report.json").read_text(encoding="utf-8"))
          projection = json.loads((base / "public-output" / "public-projection-manifest.json").read_text(encoding="utf-8"))

          assert cycle["status"] == "SHADOW_EVALUATION_NOT_CANONICAL", cycle["status"]
          assert cycle["assessment_mutation_performed"] is False
          assert cycle["canonical_successor_written"] is False
          assert cycle["governance_layer_applied"] is False
          assert cycle["release_authority_state"] == "DEFERRED"

          stages = cycle["stage_results"]
          assert stages["baseline_seed"]["count"] == 22
          collect = stages["collect"]
          counts = collect["collection_run"]["counts"]
          assert counts["logical_sources"] == 25, counts
          assert counts["total"] == 25, counts
          assert counts["unique_retrievals"] == 25, counts
          assert counts["retrieval_target_groups"] == 25, counts
          assert counts["coalesced_source_count"] == 0, counts
          assert collect["capture_digest_count"] + collect["failure_summary_count"] == 25
          assert stages["technical_handoff_approval"]["count"] == collect["capture_digest_count"]
          assert len(stages["quarantine_approve_handoff"]["handoffs"]) == collect["capture_digest_count"]

          outcomes = cycle["source_outcomes"]
          assert len(outcomes) == 25
          assert len({row["source_id"] for row in outcomes}) == 25
          by_source = {row["source_id"]: row for row in outcomes}
          prior_failures = {"SRC-0041", "SRC-0115", "SRC-14-007"}
          assert prior_failures <= set(by_source)
          assert all(by_source[source_id]["finding_effect"] == "NONE" for source_id in prior_failures)

          compare_stage = stages["compare_snapshots"]
          core = compare_stage["comparisons"]
          detailed = compare_stage["detailed_comparisons"]
          assert len(core) == len(detailed) == compare_stage["count"]
          assert compare_stage["count"] >= 1
          assert compare_stage["count"] + compare_stage["first_capture_without_baseline"] == collect["capture_digest_count"]
          for row in detailed:
              assert row["older_snapshot_id"] and row["newer_snapshot_id"]
              assert len(row["older_sha256"]) == 64 and len(row["newer_sha256"]) == 64
              assert row["normalization_version"]
              adapter = row["adapter_binding"]
              assert adapter["older_id"] and adapter["newer_id"]
              assert adapter["older_implementation_version"] and adapter["newer_implementation_version"]
              config = row["collector_configuration"]
              assert config["older"] and config["newer"]
              assert row["comparison_timestamp"]

          expected_candidate_sources = {row["source_id"] for row in core if row["candidate_required"]}
          actual_candidate_sources = {row["source_id"] for row in stages["create_change_candidate"]["candidates"]}
          manual_first_capture_sources = {
              row["source_id"] for row in outcomes if row["outcome_type"] == "MANUAL_FIRST_CAPTURE"
          }
          assert actual_candidate_sources == expected_candidate_sources
          assert actual_candidate_sources.isdisjoint(manual_first_capture_sources)
          assert stages["development_disposition"]["count"] == stages["create_change_candidate"]["count"]
          assert stages["development_disposition"]["scope"] == "DEVELOPMENT_PIPELINE_ONLY"
          assert stages["development_disposition"]["substantive_authority"] is False
          assert stages["development_disposition"]["assessment_mutation_performed"] is False
          assert stages["apply_delta"]["predecessor_unchanged"] is True
          assert stages["publications"]["reconciled"] is True

          execution = report["execution"]
          assert report["inputs"]["baseline_summary_sha256"] == os.environ["BASELINE_SUMMARY_SHA256"]
          assert report["inputs"]["registry_sha256"] == os.environ["OPERATIONAL_REGISTRY_SHA256"]
          assert report["inputs"]["predecessor_sha256"] == os.environ["PREDECESSOR_SHA256"]
          assert execution["baseline_verified_count"] == 22
          assert execution["source_outcome_count"] == 25
          assert execution["true_comparison_count"] == compare_stage["count"]
          assert execution["candidate_count"] == stages["create_change_candidate"]["count"]
          assert execution["development_disposition_count"] == stages["development_disposition"]["count"]
          assert execution["publication_reconciled"] is True
          assert report["safety"]["predecessor_unchanged"] is True
          assert report["safety"]["assessment_mutation_performed"] is False
          assert report["safety"]["canonical_successor_written"] is False
          assert report["safety"]["governance_layer_applied"] is False
          assert report["safety"]["release_authority_state"] == "DEFERRED"
          assert projection["safety"]["contains_protected_capture_bytes"] is False
          assert projection["safety"]["contains_protected_paths"] is False
          assert projection["safety"]["contains_delta_operations"] is False
          assert projection["safety"]["canonical_successor_written"] is False
          assert projection["safety"]["assessment_mutation_performed"] is False
          assert projection["safety"]["governance_layer_applied"] is False
          assert projection["safety"]["release_authority_state"] == "DEFERRED"

          failures_root = base / "current-quarantine" / "failures"
          failure_records = {}
          if failures_root.is_dir():
              for path in failures_root.glob("*.json"):
                  row = json.loads(path.read_text(encoding="utf-8"))
                  failure_records[row["source_id"]] = row
          collection_outcomes = {row["source_id"]: row for row in collect["collection_run"]["outcomes"]}
          for source_id in prior_failures:
              live_outcome = by_source[source_id]
              if live_outcome["failure_class"]:
                  failure = failure_records[source_id]
                  assert failure["failed_at"]
                  assert failure["requested_url"].startswith(("http://", "https://"))
                  assert failure["retry_state"]["attempt_count"] >= 1
                  assert failure["retry_state"]["max_attempts"] >= 1
                  assert failure["collector_version"]
                  assert len(failure["configuration_hash"]) == 64
                  assert collection_outcomes[source_id]["adapter_id"]

          forbidden_keys = {
              "quarantine_path",
              "stored_path",
              "evaluation_workspace",
              "output_dir",
              "successor_path",
          }
          forbidden_fragments = [
              os.environ["RUNNER_TEMP"],
              "/home/runner/",
              "/tmp/",
              "protected/quarantine/",
              "current-quarantine/",
              "evaluation-workspace/",
              "cycle-output/",
          ]

          def scan(value):
              if isinstance(value, dict):
                  assert not (forbidden_keys & set(value)), forbidden_keys & set(value)
                  for child in value.values():
                      scan(child)
              elif isinstance(value, list):
                  for child in value:
                      scan(child)
              elif isinstance(value, str):
                  for fragment in forbidden_fragments:
                      assert fragment not in value, (fragment, value)

          scan(report)
          scan(projection)
          public_files = {path.name for path in (base / "public-output").iterdir() if path.is_file()}
          assert public_files == {
              "comparative-refresh-report.json",
              "public-projection-manifest.json",
              "SHA256_MANIFEST.json",
          }, public_files
          print(json.dumps({
              "captures": collect["capture_digest_count"],
              "failures": collect["failure_summary_count"],
              "comparisons": compare_stage["count"],
              "first_capture_without_baseline": compare_stage["first_capture_without_baseline"],
              "candidates": stages["create_change_candidate"]["count"],
              "delta_operations": stages["compile_adjudicated_delta"].get("operation_count"),
              "reopening_recommendations": stages["reopening_analysis"].get("recommendation_count"),
          }, sort_keys=True))
          PY

      - name: Package protected second-cycle custody artifact
        shell: bash
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/issue120"
          tar -czf "$BASE/protected-issue-120-comparative-cycle.tar.gz" \
            -C "$BASE" evaluation-workspace current-quarantine cycle-output
          sha256sum "$BASE/protected-issue-120-comparative-cycle.tar.gz" \
            > "$BASE/protected-issue-120-comparative-cycle.tar.gz.sha256"

      - name: Upload protected second-cycle artifact
        id: upload_protected
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: protected-issue-120-comparative-cycle-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/issue120/protected-issue-120-comparative-cycle.tar.gz
            ${{ runner.temp }}/issue120/protected-issue-120-comparative-cycle.tar.gz.sha256
          retention-days: 90
          compression-level: 0
          if-no-files-found: error

      - name: Build digest-only execution record and final public manifest
        env:
          PROTECTED_ARTIFACT_ID: ${{ steps.upload_protected.outputs.artifact-id }}
          PROTECTED_ARTIFACT_DIGEST: ${{ steps.upload_protected.outputs.artifact-digest }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          base = Path(os.environ["RUNNER_TEMP"]) / "issue120"
          public = base / "public-output"
          report_path = public / "comparative-refresh-report.json"
          projection_path = public / "public-projection-manifest.json"
          report = json.loads(report_path.read_text(encoding="utf-8"))
          projection = json.loads(projection_path.read_text(encoding="utf-8"))
          protected_tar = base / "protected-issue-120-comparative-cycle.tar.gz"

          def sha(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          record = {
              "schema_version": 1,
              "issue": "#120",
              "artifact": "issue_120_comparative_execution_record",
              "status": "SHADOW_EVALUATION_NOT_CANONICAL",
              "executed_date": "2026-08-11",
              "validated_software_head": os.environ["VALIDATED_SOFTWARE_HEAD"],
              "execution_workflow_commit": os.environ["GITHUB_SHA"],
              "github_actions_run_id": os.environ["GITHUB_RUN_ID"],
              "baseline": {
                  "artifact_id": os.environ["BASELINE_ARTIFACT_ID"],
                  "artifact_name": os.environ["BASELINE_ARTIFACT_NAME"],
                  "github_artifact_sha256": os.environ["BASELINE_ARTIFACT_SHA256"],
                  "inner_tar_gz_sha256": os.environ["BASELINE_INNER_SHA256"],
                  "baseline_summary_sha256": os.environ["BASELINE_SUMMARY_SHA256"],
                  "reviewed_plan_sha256": os.environ["REVIEWED_PLAN_SHA256"],
                  "operational_registry_sha256": os.environ["OPERATIONAL_REGISTRY_SHA256"],
                  "predecessor_sha256": os.environ["PREDECESSOR_SHA256"],
              },
              "second_cycle_protected_artifact": {
                  "artifact_id": os.environ["PROTECTED_ARTIFACT_ID"],
                  "artifact_name": f"protected-issue-120-comparative-cycle-{os.environ['GITHUB_RUN_ID']}",
                  "github_artifact_digest": os.environ["PROTECTED_ARTIFACT_DIGEST"],
                  "inner_tar_gz_sha256": sha(protected_tar),
                  "retention_days": 90,
              },
              "execution": report["execution"],
              "safety": report["safety"],
              "public_projection_safety": projection["safety"],
              "public_artifacts": {
                  "comparative_refresh_report_sha256": sha(report_path),
                  "public_projection_manifest_sha256": sha(projection_path),
              },
              "authority_boundary": {
                  "substantive_authority": False,
                  "governance_layer_applied": False,
                  "release_authority_state": "DEFERRED",
                  "canonical_successor_written": False,
                  "assessment_mutation_performed": False,
                  "protected_capture_bytes_committed_to_git": False,
                  "protected_filesystem_paths_committed_to_git": False,
              },
              "boundary": "Digest-only execution record for the noncanonical issue #120 comparative cycle. It grants no scientific, clinical, regulatory, conformance, institutional, UNESCO, governance, release, or canonical publication authority.",
          }
          execution_path = public / "execution-record.json"
          execution_path.write_text(json.dumps(record, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          manifest_path = public / "SHA256_MANIFEST.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["execution_record"] = {
              "path": execution_path.name,
              "sha256": sha(execution_path),
          }
          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          for entry in manifest.values():
              path = public / entry["path"]
              assert path.is_file()
              assert sha(path) == entry["sha256"]
          PY

      - name: Final public-boundary scan
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          public = Path(os.environ["RUNNER_TEMP"]) / "issue120" / "public-output"
          expected = {
              "comparative-refresh-report.json",
              "public-projection-manifest.json",
              "execution-record.json",
              "SHA256_MANIFEST.json",
          }
          files = {path.name for path in public.iterdir() if path.is_file()}
          assert files == expected, files
          forbidden_keys = {"quarantine_path", "stored_path", "evaluation_workspace", "output_dir", "successor_path"}
          forbidden_fragments = [os.environ["RUNNER_TEMP"], "/home/runner/", "/tmp/", "protected/quarantine/", "current-quarantine/", "evaluation-workspace/", "cycle-output/"]
          for path in public.glob("*.json"):
              value = json.loads(path.read_text(encoding="utf-8"))
              stack = [value]
              while stack:
                  item = stack.pop()
                  if isinstance(item, dict):
                      assert not (forbidden_keys & set(item)), (path.name, forbidden_keys & set(item))
                      stack.extend(item.values())
                  elif isinstance(item, list):
                      stack.extend(item)
                  elif isinstance(item, str):
                      for fragment in forbidden_fragments:
                          assert fragment not in item, (path.name, fragment, item)
          assert not any(public.glob("*.xlsx"))
          assert not any(public.glob("*.docx"))
          assert not any(public.glob("*.pdf"))
          assert not any(public.glob("*.html"))
          PY

      - name: Upload digest-only public execution artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-issue-120-comparative-execution-${{ github.run_id }}
          path: ${{ runner.temp }}/issue120/public-output
          retention-days: 14
          if-no-files-found: error
