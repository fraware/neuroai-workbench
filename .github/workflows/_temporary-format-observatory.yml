name: Temporary observatory formatter

on:
  push:
    branches: [agent/observatory-operations-foundation]

permissions:
  contents: write

concurrency:
  group: temporary-observatory-formatter
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/observatory-operations-foundation
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --require-hashes -r requirements/constraints.txt
      - run: python -m ruff format src/neuroai_workbench/monitoring.py src/neuroai_workbench/monitoring_cli.py tests/unit/test_monitoring.py tests/unit/test_monitoring_cli.py
      - run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/neuroai_workbench/monitoring.py src/neuroai_workbench/monitoring_cli.py tests/unit/test_monitoring.py tests/unit/test_monitoring_cli.py
          git commit -m "Format observatory operations code"
          git push origin HEAD:agent/observatory-operations-foundation
