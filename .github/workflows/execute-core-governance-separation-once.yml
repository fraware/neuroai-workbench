name: Execute core-governance separation once

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/defer-governance-core-cycle'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
          cache: pip
      - name: Install pinned environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements/constraints.txt
          python -m pip install --no-deps -e .
      - name: Execute embedded constrained transformation
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/apply-core-governance-separation-once.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          program = textwrap.dedent(source[start:end])
          namespace = {'__name__': '__core_governance_refactor__'}
          exec(compile(program, '<core-governance-refactor>', 'exec'), namespace)
          PY
      - name: Format and inspect
        run: |
          python -m ruff format src/neuroai_workbench/shadow_refresh/cycle.py scripts/run_evaluation_cycle.py scripts/close_shadow_refresh_43.py tests/unit/test_shadow_evaluation_cycle.py
          python -m ruff check src/neuroai_workbench/shadow_refresh/cycle.py scripts/run_evaluation_cycle.py scripts/close_shadow_refresh_43.py tests/unit/test_shadow_evaluation_cycle.py
          python -m mypy src/neuroai_workbench
          python -m compileall -q src scripts
      - name: Run targeted tests
        run: |
          python -m pytest tests/unit/test_shadow_evaluation_cycle.py tests/unit/test_shadow_closure.py -q
      - name: Enforce changed-file allowlist
        run: |
          python - <<'PY'
          import subprocess
          allowed = {
              '.github/workflows/apply-core-governance-separation-once.yml',
              '.github/workflows/execute-core-governance-separation-once.yml',
              'src/neuroai_workbench/shadow_refresh/cycle.py',
              'scripts/run_evaluation_cycle.py',
              'scripts/close_shadow_refresh_43.py',
              'tests/unit/test_shadow_evaluation_cycle.py',
              'docs/operations/shadow-refresh-evaluation.md',
              'docs/operations/deferred-governance.md',
          }
          paths = {line[3:] for line in subprocess.check_output(['git', 'status', '--short'], text=True).splitlines()}
          unexpected = sorted(paths - allowed)
          if unexpected:
              raise SystemExit(f'Unexpected changed files: {unexpected}')
          print('\n'.join(sorted(paths)))
          PY
      - name: Commit refactor
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/neuroai_workbench/shadow_refresh/cycle.py \
                  scripts/run_evaluation_cycle.py \
                  scripts/close_shadow_refresh_43.py \
                  tests/unit/test_shadow_evaluation_cycle.py \
                  docs/operations/shadow-refresh-evaluation.md \
                  docs/operations/deferred-governance.md
          git commit -m "refactor: defer governance from core evaluation cycle"
          git push origin HEAD:${{ github.head_ref }}
