name: Rebase v0.2.1 verification branch

on:
  push:
    branches:
      - agent/verify-v0.2.1-release

permissions:
  contents: write

jobs:
  rebase:
    name: rebase-v0.2.1-verification-branch
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Merge current main with controlled conflict resolution
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          if git merge --no-edit origin/main; then
            git push
            exit 0
          fi
          conflicts=$(git diff --name-only --diff-filter=U)
          test "$conflicts" = '.github/required-checks.json'
          git checkout --ours .github/required-checks.json
          git add .github/required-checks.json
          git commit --no-edit
          git push
