name: Repair governance rehearsal mypy once

on:
  push:
    branches:
      - agent/114-governance-rehearsal-clean
    paths:
      - ".github/workflows/repair-governance-rehearsal-mypy-once.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/114-governance-rehearsal-clean
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Make recorder return type explicit
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/neuroai_workbench/governance_rehearsal.py")
          text = path.read_text(encoding="utf-8")
          old_import = "from typing import Any\n"
          if text.count(old_import) != 1:
              raise SystemExit("expected exactly one Any import")
          text = text.replace(old_import, "from typing import Any, cast\n", 1)
          old_return = "    return record_governance_reviewer_opinion(\n"
          if text.count(old_return) != 1:
              raise SystemExit("expected exactly one direct recorder return")
          text = text.replace(old_return, "    result = record_governance_reviewer_opinion(\n", 1)
          marker = "        actor=\"synthetic-rehearsal\",\n    )[\"opinion\"]\n\n\ndef _record_fixture_opinions("
          replacement = "        actor=\"synthetic-rehearsal\",\n    )\n    return cast(dict[str, Any], result[\"opinion\"])\n\n\ndef _record_fixture_opinions("
          if text.count(marker) != 1:
              raise SystemExit("expected exactly one recorder result marker")
          text = text.replace(marker, replacement, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Install exact dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements/constraints.txt
          python -m pip install --no-deps -e .
      - name: Verify type repair
        run: |
          python -m ruff format src/neuroai_workbench/governance_rehearsal.py
          python -m ruff check src/neuroai_workbench/governance_rehearsal.py
          python -m mypy src/neuroai_workbench
          python -m pytest tests/unit/test_governance_rehearsal.py -q
      - name: Commit source repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/neuroai_workbench/governance_rehearsal.py
          git diff --cached --check
          git commit -m "Make rehearsal recorder return type explicit"
          git push origin HEAD:agent/114-governance-rehearsal-clean
