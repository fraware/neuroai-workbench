name: Dependency review

on:
  pull_request:

permissions:
  contents: write

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: GitHub dependency graph review
        id: dependency_graph_review
        continue-on-error: true
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: moderate
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later
      - if: steps.dependency_graph_review.outcome != 'success'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
      - if: steps.dependency_graph_review.outcome != 'success'
        run: python -m pip install --upgrade pip
      - if: steps.dependency_graph_review.outcome != 'success'
        run: python -m pip install --require-hashes -r requirements/constraints.txt
      - if: steps.dependency_graph_review.outcome != 'success'
        name: Pinned-environment vulnerability fallback
        run: python -m pip_audit -r requirements/constraints.txt
      - if: steps.dependency_graph_review.outcome != 'success'
        name: Record reduced-scope fallback boundary
        run: |
          {
            echo "## Dependency review fallback"
            echo
            echo "GitHub's dependency graph review service was unavailable for this repository."
            echo "The gate therefore ran pip-audit against the fully hashed constraints file."
            echo "This scans the pinned environment for known vulnerabilities but does not provide GitHub's PR-to-base dependency delta or license-delta analysis."
            echo "Re-enable the official dependency graph review when repository security settings support it."
          } >> "$GITHUB_STEP_SUMMARY"

  unify-case-lock:
    name: unify-case-lock
    if: github.head_ref == 'agent/transactional-evidence-journal' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --require-hashes -r requirements/constraints.txt
      - name: Apply exact lock refactor
        run: |
          python - <<'PY'
          from pathlib import Path

          tx_path = Path('src/neuroai_workbench/evidence_transactions.py')
          tx = tx_path.read_text(encoding='utf-8')
          replacements = [
              ('from collections.abc import Iterator\n', ''),
              ('from contextlib import contextmanager\n', ''),
              (
                  'from .events import LOCK_PROFILE_LOCAL, _exclusive_lock, append_event, load_events\n',
                  'from .case_lock import case_mutation_lock\nfrom .events import append_event, load_events\n',
              ),
              (
                  'def _registration_lock_path(case_path: Path) -> Path:\n    return case_path / "evidence" / "registration.lock"\n\n\n',
                  '',
              ),
              (
                  '@contextmanager\ndef evidence_registration_lock(case_path: Path) -> Iterator[dict[str, Any]]:\n    with _exclusive_lock(_registration_lock_path(case_path), profile=LOCK_PROFILE_LOCAL) as owner:\n        yield owner\n\n\n',
                  '',
              ),
              ('with evidence_registration_lock(case_path):', 'with case_mutation_lock(case_path):'),
          ]
          for old, new in replacements:
              count = tx.count(old)
              if count != 1:
                  raise SystemExit(f'transaction replacement expected once, observed {count}: {old[:60]!r}')
              tx = tx.replace(old, new)
          tx_path.write_text(tx, encoding='utf-8')

          evidence_path = Path('src/neuroai_workbench/evidence.py')
          evidence = evidence_path.read_text(encoding='utf-8')
          old_import = 'from .evidence_transactions import (\n    apply_evidence_transaction,\n    evidence_registration_lock,\n'
          new_import = 'from .case_lock import case_mutation_lock\nfrom .evidence_transactions import (\n    apply_evidence_transaction,\n'
          if evidence.count(old_import) != 1:
              raise SystemExit('evidence import boundary did not match')
          evidence = evidence.replace(old_import, new_import)
          if evidence.count('with evidence_registration_lock(case):') != 1:
              raise SystemExit('evidence lock use did not match')
          evidence = evidence.replace('with evidence_registration_lock(case):', 'with case_mutation_lock(case):')
          evidence_path.write_text(evidence, encoding='utf-8')
          PY
      - run: python -m ruff format src/neuroai_workbench/case_lock.py src/neuroai_workbench/evidence.py src/neuroai_workbench/evidence_transactions.py src/neuroai_workbench/workspace.py tests/unit/test_evidence_transactions.py
      - run: python -m ruff check --fix src/neuroai_workbench/case_lock.py src/neuroai_workbench/evidence.py src/neuroai_workbench/evidence_transactions.py src/neuroai_workbench/workspace.py tests/unit/test_evidence_transactions.py
      - run: python -m ruff format --check src/neuroai_workbench/case_lock.py src/neuroai_workbench/evidence.py src/neuroai_workbench/evidence_transactions.py src/neuroai_workbench/workspace.py tests/unit/test_evidence_transactions.py
      - run: python -m ruff check src/neuroai_workbench/case_lock.py src/neuroai_workbench/evidence.py src/neuroai_workbench/evidence_transactions.py src/neuroai_workbench/workspace.py tests/unit/test_evidence_transactions.py
      - run: python -m mypy src/neuroai_workbench
      - run: python -m pytest tests/unit/test_evidence_transactions.py tests/unit/test_evidence.py tests/unit/test_events.py tests/unit/test_workspace.py -q
      - name: Commit validated refactor
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/neuroai_workbench/case_lock.py src/neuroai_workbench/evidence.py src/neuroai_workbench/evidence_transactions.py src/neuroai_workbench/workspace.py tests/unit/test_evidence_transactions.py
          git commit -m "fix: serialize case mutations with one durable lock"
          git push origin HEAD:${{ github.head_ref }}
