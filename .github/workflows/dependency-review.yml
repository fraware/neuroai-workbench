name: Dependency review

on:
  pull_request:

permissions:
  contents: write

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: GitHub dependency graph review
        id: dependency_graph_review
        continue-on-error: true
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: moderate
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later
      - if: steps.dependency_graph_review.outcome != 'success'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
      - if: steps.dependency_graph_review.outcome != 'success'
        run: python -m pip install --upgrade pip
      - if: steps.dependency_graph_review.outcome != 'success'
        run: python -m pip install --require-hashes -r requirements/constraints.txt
      - if: steps.dependency_graph_review.outcome != 'success'
        name: Pinned-environment vulnerability fallback
        run: python -m pip_audit -r requirements/constraints.txt
      - if: steps.dependency_graph_review.outcome != 'success'
        name: Record reduced-scope fallback boundary
        run: |
          {
            echo "## Dependency review fallback"
            echo
            echo "GitHub's dependency graph review service was unavailable for this repository."
            echo "The gate therefore ran pip-audit against the fully hashed constraints file."
            echo "This scans the pinned environment for known vulnerabilities but does not provide GitHub's PR-to-base dependency delta or license-delta analysis."
            echo "Re-enable the official dependency graph review when repository security settings support it."
          } >> "$GITHUB_STEP_SUMMARY"

  core-governance-refactor:
    name: core-governance-refactor
    if: github.head_ref == 'agent/defer-governance-core-cycle' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --require-hashes -r requirements/constraints.txt
      - run: python -m pip install --no-deps -e .
      - name: Apply exact refactor
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/apply-core-governance-separation-once.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          program = textwrap.dedent(source[start:end])
          loop_start = program.index("for field in ('decision', 'rationale', 'change_class', 'materiality', 'reopening_effect'):")
          loop_end = program.index("cycle = replace_exact(\n    cycle,\n    'substantive classification pending human review.'", loop_start)
          robust_loop = "for field in ('decision', 'rationale', 'change_class', 'materiality', 'reopening_effect'):\n    old = f'adj.{field}'\n    new = f'disposition.{field}'\n    observed = cycle.count(old)\n    if observed != 2:\n        raise SystemExit(f'cycle disposition field {field}: expected 2 occurrences, observed {observed}')\n    cycle = cycle.replace(old, new)\n"
          program = program[:loop_start] + robust_loop + program[loop_end:]
          exec(compile(program, '<core-governance-refactor>', 'exec'), {'__name__': '__core_governance_refactor__'})
          PY
      - run: python -m ruff format src/neuroai_workbench/shadow_refresh/cycle.py scripts/run_evaluation_cycle.py scripts/close_shadow_refresh_43.py tests/unit/test_shadow_evaluation_cycle.py
      - run: python -m ruff check src/neuroai_workbench/shadow_refresh/cycle.py scripts/run_evaluation_cycle.py scripts/close_shadow_refresh_43.py tests/unit/test_shadow_evaluation_cycle.py
      - run: python -m mypy src/neuroai_workbench
      - run: python -m compileall -q src scripts
      - run: python -m pytest tests/unit/test_shadow_evaluation_cycle.py tests/unit/test_shadow_closure.py -q
      - name: Commit branch result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/neuroai_workbench/shadow_refresh/cycle.py \
                  scripts/run_evaluation_cycle.py \
                  scripts/close_shadow_refresh_43.py \
                  tests/unit/test_shadow_evaluation_cycle.py \
                  docs/operations/shadow-refresh-evaluation.md \
                  docs/operations/deferred-governance.md
          git commit -m "refactor: defer governance from core evaluation cycle"
          git push origin HEAD:${{ github.head_ref }}
