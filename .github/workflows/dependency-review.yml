name: Dependency review

on:
  pull_request:

permissions:
  contents: write

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: GitHub dependency graph review
        id: dependency_graph_review
        continue-on-error: true
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: moderate
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later
      - if: steps.dependency_graph_review.outcome != 'success'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
      - if: steps.dependency_graph_review.outcome != 'success'
        run: python -m pip install --upgrade pip
      - if: steps.dependency_graph_review.outcome != 'success'
        run: python -m pip install --require-hashes -r requirements/constraints.txt
      - if: steps.dependency_graph_review.outcome != 'success'
        name: Pinned-environment vulnerability fallback
        run: python -m pip_audit -r requirements/constraints.txt
      - if: steps.dependency_graph_review.outcome != 'success'
        name: Record reduced-scope fallback boundary
        run: |
          {
            echo "## Dependency review fallback"
            echo
            echo "GitHub's dependency graph review service was unavailable for this repository."
            echo "The gate therefore ran pip-audit against the fully hashed constraints file."
            echo "This scans the pinned environment for known vulnerabilities but does not provide GitHub's PR-to-base dependency delta or license-delta analysis."
            echo "Re-enable the official dependency graph review when repository security settings support it."
          } >> "$GITHUB_STEP_SUMMARY"

  assignment-lineage-refactor:
    name: assignment-lineage-refactor
    if: github.head_ref == 'agent/20-assignment-supersession' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --require-hashes -r requirements/constraints.txt
      - run: python -m pip install --no-deps -e .
      - name: Install verified payload
        run: python scripts/apply_issue20_payload.py
      - name: Apply repository formatter
        run: >-
          python -m ruff format
          src/neuroai_workbench/review.py
          src/neuroai_workbench/cli.py
          tests/unit/test_review_assignment_transitions.py
      - name: Lint permanent source
        run: >-
          python -m ruff check
          src/neuroai_workbench/review.py
          src/neuroai_workbench/cli.py
          tests/unit/test_review_assignment_transitions.py
      - run: python -m mypy src/neuroai_workbench
      - run: python -m compileall -q src scripts
      - name: Focused review and CLI tests
        run: >-
          python -m pytest -q
          tests/unit/test_review.py
          tests/unit/test_review_assignment_transitions.py
      - name: Commit validated permanent files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/neuroai_workbench/review.py \
            src/neuroai_workbench/cli.py \
            tests/unit/test_review_assignment_transitions.py \
            docs/reference/review.md \
            docs/adr/0011-append-only-review-assignment-lineage.md \
            THREAT_MODEL.md \
            DATA_GOVERNANCE.md
          git commit -m "feat: add append-only review assignment lineage"
          git push origin HEAD:${{ github.head_ref }}
