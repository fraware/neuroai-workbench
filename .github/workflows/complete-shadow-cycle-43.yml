name: Complete protected shadow cycle 43

on:
  push:
    branches:
      - agent/complete-shadow-cycle-43

permissions:
  contents: write

concurrency:
  group: complete-protected-shadow-cycle-43
  cancel-in-progress: true

jobs:
  protected-cycle:
    name: protected-shadow-cycle-43
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      NEUROAI_LIVE_COLLECTION: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --require-hashes -r requirements/constraints.txt
      - run: python -m pip install --no-deps -e .
      - name: Execute protected non-canonical core cycle
        run: python scripts/execute_shadow_cycle_43.py --output-root "$RUNNER_TEMP/shadow-cycle-43"
      - name: Seal protected artifact and report
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/shadow-cycle-43/artifacts"
          tar -czf "$RUNNER_TEMP/shadow-cycle-43/artifacts/protected-shadow-cycle-43.tar.gz" \
            -C "$RUNNER_TEMP/shadow-cycle-43" protected
          sha256sum "$RUNNER_TEMP/shadow-cycle-43/artifacts/protected-shadow-cycle-43.tar.gz" \
            > "$RUNNER_TEMP/shadow-cycle-43/artifacts/protected-shadow-cycle-43.tar.gz.sha256"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "shadow-cycle-43"
          report_path = root / "reports" / "shadow-cycle-43-execution.json"
          report = json.loads(report_path.read_text(encoding="utf-8"))
          checksum = (root / "artifacts" / "protected-shadow-cycle-43.tar.gz.sha256").read_text(encoding="utf-8").split()[0]
          report["protected_artifact"]["sha256"] = checksum
          report["protected_artifact"]["retention_days"] = 90
          report_path.write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          markdown = [
              "# Protected non-canonical core cycle — issue #43",
              "",
              f"- Acceptance: **{report['acceptance_status']}**",
              f"- Status: `{report['status']}`",
              f"- Fresh capture digests: {report['fresh_precollection']['capture_digest_count']}",
              f"- Fresh retrieval failures: {report['fresh_precollection']['failure_count']}",
              f"- Candidates: {report['stats']['candidates']['generated']}",
              f"- Development dispositions: {report['stats']['development_disposition']['records']}",
              f"- Products reconciled: {report['stages']['publications']['reconciled']}",
              f"- Protected artifact SHA-256: `{checksum}`",
              "- Canonical successor: **not written**",
              "- Assessment mutation: **none**",
              "- Governance and release authority: deferred to #101",
              "",
              report["boundary"],
          ]
          (root / "reports" / "shadow-cycle-43-execution.md").write_text("\n".join(markdown) + "\n", encoding="utf-8")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: protected-shadow-cycle-43
          path: |
            ${{ runner.temp }}/shadow-cycle-43/artifacts/protected-shadow-cycle-43.tar.gz
            ${{ runner.temp }}/shadow-cycle-43/artifacts/protected-shadow-cycle-43.tar.gz.sha256
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: shadow-cycle-43-sanitized-report
          path: ${{ runner.temp }}/shadow-cycle-43/reports/
          if-no-files-found: error
          retention-days: 90
      - name: Commit sanitized execution evidence
        shell: bash
        run: |
          mkdir -p docs/operations
          cp "$RUNNER_TEMP/shadow-cycle-43/reports/shadow-cycle-43-execution.json" \
            docs/operations/shadow-cycle-43-execution.json
          cp "$RUNNER_TEMP/shadow-cycle-43/reports/shadow-cycle-43-execution.md" \
            docs/operations/shadow-cycle-43-execution.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/operations/shadow-cycle-43-execution.json docs/operations/shadow-cycle-43-execution.md
          git commit -m 'Record protected shadow cycle 43 execution' || exit 0
          git push
