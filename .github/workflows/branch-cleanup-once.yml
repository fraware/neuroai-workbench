name: One-shot branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/branch-cleanup-once.yml

permissions:
  contents: write

jobs:
  delete-redundant-branches:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete every branch except main
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPOSITORY"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "neuroai-one-shot-branch-cleanup",
          }

          branches = []
          page = 1
          while True:
              url = f"https://api.github.com/repos/{repo}/branches?per_page=100&page={page}"
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as response:
                  batch = json.load(response)
              branches.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          targets = sorted(b["name"] for b in branches if b["name"] != "main")
          print(f"Deleting {len(targets)} redundant branch refs")
          for name in targets:
              encoded = urllib.parse.quote(name, safe="/")
              url = f"https://api.github.com/repos/{repo}/git/refs/heads/{encoded}"
              req = urllib.request.Request(url, headers=headers, method="DELETE")
              try:
                  with urllib.request.urlopen(req) as response:
                      response.read()
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      print(f"already absent: {name}")
                      continue
                  detail = exc.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"failed to delete {name}: HTTP {exc.code}: {detail}") from exc
              print(f"deleted: {name}")
          PY
