name: Harden governance scope

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  harden:
    name: harden
    if: github.event.pull_request.head.ref == 'agent/governance-scope-binding' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/governance-scope-binding
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --require-hashes -r requirements/constraints.txt
      - name: Enforce complete manifest binding
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if text.count(old) != 1:
                  raise SystemExit(f"{label} was not found exactly once")
              return text.replace(old, new)

          source = Path("src/neuroai_workbench/governance_scope.py")
          text = source.read_text(encoding="utf-8")
          text = replace_once(
              text,
              'PROTECTED_PREFIX = "protected-ref:"\n',
              'PROTECTED_PREFIX = "protected-ref:"\nRUNTIME_PRIVATE_KEYS = frozenset({"_path"})\n',
              "protected-prefix anchor",
          )
          text = replace_once(
              text,
              '''def _hash_record(value: dict[str, Any]) -> str:\n    controlled = {key: item for key, item in value.items() if key != "manifest_sha256" and not key.startswith("_")}\n    return sha256_bytes(canonical_json_bytes(controlled))\n''',
              '''def _hash_record(value: dict[str, Any]) -> str:\n    controlled = {\n        key: item\n        for key, item in value.items()\n        if key != "manifest_sha256" and key not in RUNTIME_PRIVATE_KEYS\n    }\n    return sha256_bytes(canonical_json_bytes(controlled))\n''',
              "hash-record block",
          )
          text = replace_once(
              text,
              '''    protected_bindings = protected_bindings or {}\n    controlled = {key: value for key, value in manifest.items() if not key.startswith("_")}\n    errors = list(_schema_errors(controlled, SCOPE_SCHEMA))\n    warnings: list[str] = []\n    roles: list[str] = []\n''',
              '''    protected_bindings = protected_bindings or {}\n    unsupported_private_keys = sorted(\n        key for key in manifest if key.startswith("_") and key not in RUNTIME_PRIVATE_KEYS\n    )\n    controlled = {key: value for key, value in manifest.items() if key not in RUNTIME_PRIVATE_KEYS}\n    errors = list(_schema_errors(controlled, SCOPE_SCHEMA))\n    if unsupported_private_keys:\n        errors.append(\n            {\n                "code": "UNSUPPORTED_PRIVATE_FIELDS",\n                "path": "",\n                "fields": unsupported_private_keys,\n            }\n        )\n    warnings: list[str] = []\n    roles: list[str] = []\n''',
              "manifest verification preamble",
          )
          text = replace_once(
              text,
              '''    if controlled.get("manifest_sha256") != _hash_record(controlled):\n        errors.append({"code": "MANIFEST_SHA256_MISMATCH", "path": "manifest_sha256"})\n\n    objects = controlled.get("objects")\n''',
              '''    if controlled.get("manifest_sha256") != _hash_record(controlled):\n        errors.append({"code": "MANIFEST_SHA256_MISMATCH", "path": "manifest_sha256"})\n    if controlled.get("boundary") != GOVERNANCE_SCOPE_BOUNDARY:\n        errors.append({"code": "AUTHORITY_BOUNDARY_MISMATCH", "path": "boundary"})\n\n    objects = controlled.get("objects")\n''',
              "manifest hash anchor",
          )
          text = replace_once(
              text,
              '''    duplicate_roles = sorted({role for role in roles if roles.count(role) > 1})\n    if duplicate_roles:\n        errors.append({"code": "DUPLICATE_LOGICAL_ROLES", "path": "objects", "roles": duplicate_roles})\n    missing_roles = sorted(REQUIRED_ROLES - set(roles))\n''',
              '''    duplicate_roles = sorted({role for role in roles if roles.count(role) > 1})\n    if duplicate_roles:\n        errors.append({"code": "DUPLICATE_LOGICAL_ROLES", "path": "objects", "roles": duplicate_roles})\n    if roles != sorted(roles):\n        errors.append({"code": "OBJECT_ORDER_NONCANONICAL", "path": "objects"})\n    digests = [\n        str(item.get("sha256"))\n        for item in objects\n        if isinstance(item, dict) and isinstance(item.get("sha256"), str)\n    ]\n    duplicate_digests = sorted({digest for digest in digests if digests.count(digest) > 1})\n    if duplicate_digests:\n        errors.append(\n            {\n                "code": "DUPLICATE_OBJECT_DIGESTS",\n                "path": "objects",\n                "digests": duplicate_digests,\n            }\n        )\n    missing_roles = sorted(REQUIRED_ROLES - set(roles))\n''',
              "logical role anchor",
          )
          source.write_text(text, encoding="utf-8")

          schema = Path("src/neuroai_workbench/resources/operations/GOVERNANCE_SCOPE_MANIFEST.schema.json")
          schema_text = replace_once(
              schema.read_text(encoding="utf-8"),
              '    "boundary": {"type": "string", "minLength": 1},\n',
              '    "boundary": {"const": "Governance scope manifests bind byte identities and storage boundaries only. Digest validity does not authenticate a source, validate substantive claims, identify a reviewer, or authorize a successor release."},\n',
              "schema boundary field",
          )
          schema.write_text(schema_text, encoding="utf-8")

          tests = Path("tests/unit/test_governance_scope.py")
          test_text = tests.read_text(encoding="utf-8")
          if "def test_manifest_binding_rejects_unbound_fields_and_substitution" not in test_text:
              test_text += '''\n\ndef test_manifest_binding_rejects_unbound_fields_and_substitution(tmp_path: Path) -> None:\n    _, roots, bindings, result = _record(tmp_path)\n    manifest = result["manifest"]\n\n    runtime = json.loads(json.dumps(manifest))\n    runtime["_path"] = "/runtime-only/path"\n    assert _hash_record(runtime) == manifest["manifest_sha256"]\n    assert verify_governance_scope_manifest(\n        runtime, boundary_roots=roots, protected_bindings=bindings\n    )["valid"] is True\n\n    private = json.loads(json.dumps(manifest))\n    private["_unbound_authority"] = "release approved"\n    private["manifest_sha256"] = _hash_record(private)\n    report = verify_governance_scope_manifest(\n        private, boundary_roots=roots, protected_bindings=bindings\n    )\n    assert "UNSUPPORTED_PRIVATE_FIELDS" in _error_codes(report)\n    assert report["valid"] is False\n\n    boundary = json.loads(json.dumps(manifest))\n    boundary["boundary"] = "This scope authorizes publication."\n    boundary["manifest_sha256"] = _hash_record(boundary)\n    report = verify_governance_scope_manifest(\n        boundary, boundary_roots=roots, protected_bindings=bindings\n    )\n    assert "AUTHORITY_BOUNDARY_MISMATCH" in _error_codes(report)\n\n    reordered = json.loads(json.dumps(manifest))\n    reordered["objects"] = list(reversed(reordered["objects"]))\n    reordered["manifest_sha256"] = _hash_record(reordered)\n    report = verify_governance_scope_manifest(\n        reordered, boundary_roots=roots, protected_bindings=bindings\n    )\n    assert "OBJECT_ORDER_NONCANONICAL" in _error_codes(report)\n\n    substituted = json.loads(json.dumps(manifest))\n    delta = next(item for item in substituted["objects"] if item["role"] == "DELTA")\n    candidate = next(\n        item for item in substituted["objects"] if item["role"] == "SUCCESSOR_CANDIDATE"\n    )\n    candidate["sha256"] = delta["sha256"]\n    substituted["manifest_sha256"] = _hash_record(substituted)\n    report = verify_governance_scope_manifest(\n        substituted, boundary_roots=roots, protected_bindings=bindings\n    )\n    assert "DUPLICATE_OBJECT_DIGESTS" in _error_codes(report)\n'''
          tests.write_text(test_text, encoding="utf-8")

          docs = Path("docs/reference/governance-scope-manifests.md")
          docs_text = replace_once(
              docs.read_text(encoding="utf-8"),
              "The object list is sorted by logical role before the manifest is recorded. A matching digest establishes byte identity for the acquired file. It does not establish source authenticity, truth, completeness, legal admissibility, reviewer identity, or institutional delegation.\n",
              "The object list is sorted by logical role before the manifest is recorded. Verification rejects non-canonical ordering, duplicate object digests across logical roles, altered authority-boundary text, and every underscore-prefixed field except the internal `_path` key added only while loading local records. A matching digest establishes byte identity for the acquired file. It does not establish source authenticity, truth, completeness, legal admissibility, reviewer identity, or institutional delegation.\n",
              "documentation canonical identity paragraph",
          )
          docs.write_text(docs_text, encoding="utf-8")
          PY
      - run: python -m ruff format src/neuroai_workbench/governance_scope.py tests/unit/test_governance_scope.py
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m pytest tests/unit/test_governance_scope.py --cov=neuroai_workbench.governance_scope --cov-report=term-missing --cov-fail-under=95
      - run: python scripts/check_github_workflow_contract.py
      - name: Commit exact hardening changes
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/neuroai_workbench/governance_scope.py src/neuroai_workbench/resources/operations/GOVERNANCE_SCOPE_MANIFEST.schema.json tests/unit/test_governance_scope.py docs/reference/governance-scope-manifests.md
          git commit -m "Harden governance manifest binding"
          git push origin HEAD:agent/governance-scope-binding
