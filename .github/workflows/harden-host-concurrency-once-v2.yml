name: Harden host concurrency once v2

on:
  push:
    branches:
      - agent/153-operational-99-due-cycle
    paths:
      - .github/workflows/harden-host-concurrency-once-v2.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/153-operational-99-due-cycle
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --require-hashes -r requirements/constraints.txt
      - run: python -m pip install --no-deps -e .
      - name: Move host limit to actual HTTP send boundary
        run: |
          cat > src/neuroai_workbench/collector/host_limit.py <<'PY'
          from __future__ import annotations

          from collections.abc import Iterator
          from contextlib import contextmanager
          from dataclasses import dataclass, field
          from threading import BoundedSemaphore, Lock
          from urllib.parse import urlparse

          from .http_client import HttpRequest, HttpTransport


          def host_from_url(url: str) -> str:
              """Return the canonical hostname used for transport concurrency accounting."""
              hostname = urlparse(url).hostname
              return hostname.lower().rstrip(".") if hostname else "unknown"


          class HostPermitPool:
              """Thread-safe per-host permit registry shared by all HTTP sends in one scheduler run."""

              def __init__(self, limit: int) -> None:
                  if limit < 1:
                      raise ValueError("per-host transport limit must be >= 1")
                  self.limit = limit
                  self._lock = Lock()
                  self._permits: dict[str, BoundedSemaphore] = {}

              def _permit(self, host: str) -> BoundedSemaphore:
                  with self._lock:
                      permit = self._permits.get(host)
                      if permit is None:
                          permit = BoundedSemaphore(self.limit)
                          self._permits[host] = permit
                      return permit

              @contextmanager
              def acquire(self, url: str) -> Iterator[str]:
                  host = host_from_url(url)
                  permit = self._permit(host)
                  permit.acquire()
                  try:
                      yield host
                  finally:
                      permit.release()


          @dataclass(frozen=True)
          class HostLimitedTransport:
              """Limit every actual transport send, including redirect hops, by destination host."""

              inner: HttpTransport
              max_workers_per_host: int
              _permits: HostPermitPool = field(init=False, repr=False, compare=False)

              def __post_init__(self) -> None:
                  object.__setattr__(self, "_permits", HostPermitPool(self.max_workers_per_host))

              def send(
                  self,
                  request: HttpRequest,
                  *,
                  connect_timeout: float,
                  read_timeout: float,
              ) -> tuple[int, dict[str, str], bytes]:
                  with self._permits.acquire(request.url):
                      return self.inner.send(
                          request,
                          connect_timeout=connect_timeout,
                          read_timeout=read_timeout,
                      )
          PY

          python - <<'PY'
          from pathlib import Path

          path = Path("src/neuroai_workbench/collector/scheduler.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace("from collections.abc import Callable, Iterator\n", "from collections.abc import Callable\n", 1)
          text = text.replace("from contextlib import contextmanager\n", "", 1)
          text = text.replace("from threading import BoundedSemaphore, Lock\n", "", 1)
          text = text.replace(
              "from .handoff import prepare_monitoring_handoff\nfrom .http_client import HttpTransport\n",
              "from .handoff import prepare_monitoring_handoff\nfrom .host_limit import HostLimitedTransport, host_from_url\nfrom .http_client import HttpTransport\n",
              1,
          )
          class_start = text.index("class _HostPermitPool:\n")
          class_end = text.index("\n\n@dataclass\nclass CollectionScheduler:", class_start)
          text = text[:class_start] + text[class_end + 2 :]
          text = text.replace("        host_permits: _HostPermitPool,\n", "", 1)
          old_block = '''                with host_permits.acquire(resolved_url) as host:\n                    attempt["host"] = host\n                    checkpoint = write_target_checkpoint(self.quarantine_root, checkpoint)\n                    outcome = self._invoke_adapter(\n                        adapter,\n                        request,\n                        source_record=source_record,\n                        attempt_count=attempt_count,\n                    )\n'''
          new_block = '''                attempt["host"] = host_from_url(resolved_url)\n                checkpoint = write_target_checkpoint(self.quarantine_root, checkpoint)\n                outcome = self._invoke_adapter(\n                    adapter,\n                    request,\n                    source_record=source_record,\n                    attempt_count=attempt_count,\n                )\n'''
          if old_block not in text:
              raise SystemExit("scheduler host-permit invocation block not found")
          text = text.replace(old_block, new_block, 1)
          old_adapters = '''        adapters = build_adapters(\n            config=self.collector_config,\n            transport=self.transport,\n'''
          new_adapters = '''        bounded_transport = HostLimitedTransport(\n            self.transport,\n            max_workers_per_host=self.scheduler_config.max_workers_per_host,\n        )\n        adapters = build_adapters(\n            config=self.collector_config,\n            transport=bounded_transport,\n'''
          if old_adapters not in text:
              raise SystemExit("scheduler adapter construction block not found")
          text = text.replace(old_adapters, new_adapters, 1)
          text = text.replace("        host_permits = _HostPermitPool(self.scheduler_config.max_workers_per_host)\n", "", 1)
          text = text.replace("                        host_permits=host_permits,\n", "", 1)
          path.write_text(text, encoding="utf-8")

          test_path = Path("tests/unit/test_collector_operational_runtime.py")
          tests = test_path.read_text(encoding="utf-8")
          tests = tests.replace(
              "    permanent_statuses: dict[str, int] = field(default_factory=dict)\n",
              "    permanent_statuses: dict[str, int] = field(default_factory=dict)\n    redirects: dict[str, str] = field(default_factory=dict)\n",
              1,
          )
          old = '''            if self.delay_seconds:\n                time.sleep(self.delay_seconds)\n            if request.url in self.internal_error_urls:\n'''
          new = '''            if self.delay_seconds:\n                time.sleep(self.delay_seconds)\n            if request.url in self.redirects:\n                return 302, {"Location": self.redirects[request.url]}, b""\n            if request.url in self.internal_error_urls:\n'''
          if old not in tests:
              raise SystemExit("transport delay fragment not found")
          tests = tests.replace(old, new, 1)
          anchor = '''def test_retry_policy_retries_transient_timeout_and_not_permanent_404(tmp_path: Path) -> None:\n'''
          new_test = '''def test_redirect_convergence_respects_actual_destination_host_limit(tmp_path: Path) -> None:\n    records = []\n    redirects = {}\n    for index in range(12):\n        initial = f"https://entry{index}.example.org/start/{index}"\n        final = f"https://shared.example.org/final/{index}"\n        records.append(_source(f"SRC-REDIRECT-{index:02d}", initial))\n        redirects[initial] = final\n    transport = ConcurrentTransport(delay_seconds=0.02, redirects=redirects)\n    scheduler = _scheduler(tmp_path, transport, max_workers=8, per_host=2)\n\n    run = scheduler.run_plan(_plan(records), registry_sha256=REGISTRY_HASH, source_index=_index(records))\n\n    assert run["execution_status"] == "COMPLETE"\n    assert transport.max_active > 2\n    assert transport.max_active_by_host["shared.example.org"] <= 2\n    assert sum(transport.call_counts.values()) == 24\n\n\n'''
          if anchor not in tests:
              raise SystemExit("operational retry test anchor not found")
          tests = tests.replace(anchor, new_test + anchor, 1)
          test_path.write_text(tests, encoding="utf-8")

          coverage_path = Path("scripts/check_module_coverage.py")
          coverage = coverage_path.read_text(encoding="utf-8")
          needle = '    "neuroai_workbench/collector/handoff.py": 95.0,\n'
          replacement = needle + '    "neuroai_workbench/collector/host_limit.py": 95.0,\n'
          if needle not in coverage:
              raise SystemExit("coverage insertion anchor not found")
          coverage_path.write_text(coverage.replace(needle, replacement, 1), encoding="utf-8")
          PY

          python -m ruff format src/neuroai_workbench/collector/host_limit.py src/neuroai_workbench/collector/scheduler.py tests/unit/test_collector_operational_runtime.py scripts/check_module_coverage.py
          python -m ruff check src/neuroai_workbench/collector/host_limit.py src/neuroai_workbench/collector/scheduler.py tests/unit/test_collector_operational_runtime.py scripts/check_module_coverage.py
          python -m pytest tests/unit/test_collector_operational_runtime.py -q
          python -m mypy src/neuroai_workbench
          python -m pytest -q --cov=src/neuroai_workbench --cov-report=json --cov-report=term-missing
          python scripts/check_module_coverage.py
      - name: Commit verified hardening and remove one-shot workflows
        run: |
          git rm .github/workflows/harden-host-concurrency-once.yml .github/workflows/harden-host-concurrency-once-v2.yml
          git add src/neuroai_workbench/collector/host_limit.py src/neuroai_workbench/collector/scheduler.py tests/unit/test_collector_operational_runtime.py scripts/check_module_coverage.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Enforce per-host concurrency at every HTTP send"
          git push origin HEAD:agent/153-operational-99-due-cycle
